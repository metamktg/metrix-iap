openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrix
    description: Metrix IAP data operations
paths:
  /metrix/seed:
    get:
      operationId: getMetrixSeed
      tags: [metrix]
      summary: Get the Metrix IAP seed bundle
      description: Returns the full Metrix seed bundle (manager account, ad accounts, app defaults) served from the backend.
      responses:
        "200":
          description: The seed bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetrixSeedBundle"
  /metrix/agent-waitlist:
    post:
      operationId: joinAgentWaitlist
      tags: [metrix]
      summary: Join the Metrix Agent waitlist
      description: Stores an email address on the Metrix Agent waitlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "200":
          description: Waitlist signup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignupResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listAgentWaitlist
      tags: [metrix]
      summary: List Metrix Agent waitlist signups
      description: Returns a page of waitlist entries (email and joined date), newest first. Use limit/offset to page through results; total reflects the full count. Requires an admin bearer key.
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of entries to skip from the newest entry (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceInvites
      tags: [metrix]
      summary: List pending workspace invites
      description: Returns invites created for this workspace, newest first.
      responses:
        "200":
          description: Workspace invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitesResult"
    post:
      operationId: createWorkspaceInvite
      tags: [metrix]
      summary: Invite a member to the workspace
      description: Creates a pending invite for the given email and role. Idempotent per workspace and email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInviteInput"
      responses:
        "200":
          description: Invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResult"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: revokeWorkspaceInvite
      tags: [metrix]
      summary: Revoke a pending workspace invite
      description: Deletes the pending invite, freeing its seat.
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWorkspaceInviteResult"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}/resend:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvite
      tags: [metrix]
      summary: Resend a pending workspace invite
      description: Bumps the invite's created_at timestamp to now and returns the updated invite.
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResendResult"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/notification-prefs:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getNotificationPrefs
      tags: [metrix]
      summary: Get workspace notification preference overrides
      description: Returns persisted channel and event preference overrides for this workspace. Anything not listed falls back to seed defaults on the client.
      responses:
        "200":
          description: Notification preference overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResult"
    put:
      operationId: updateNotificationPrefs
      tags: [metrix]
      summary: Update workspace notification preferences
      description: Upserts channel and/or event preference overrides for this workspace and returns the full set of persisted overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefsUpdateInput"
      responses:
        "200":
          description: Notification preference overrides after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResult"
        "400":
          description: Invalid preference payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: Static admin key configured via the ADMIN_API_KEY secret.
  schemas:
    MetrixSeedBundle:
      type: object
      description: Full Metrix IAP seed bundle. Nested account payloads are intentionally loosely typed; the client narrows them with its own seed types.
      additionalProperties: true
      properties:
        schema_version:
          type: string
        generated_at:
          type: string
        integrity_note:
          type: string
        variable_registry:
          type: array
          description: Data-layer truth about variable families, including explicit registry_missing entries (ST_/AW_/CTA_ known gap).
          items:
            type: object
            additionalProperties: true
        app_defaults:
          type: object
          additionalProperties: true
        manager_account:
          type: object
          additionalProperties: true
        ad_accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_settings:
          type: object
          additionalProperties: true
      required:
        - schema_version
        - manager_account
        - ad_accounts
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistSignupResult:
      type: object
      properties:
        status:
          type: string
          enum: [joined, already_joined]
        email:
          type: string
      required:
        - status
        - email
    WaitlistEntry:
      type: object
      properties:
        email:
          type: string
        joined_at:
          type: string
      required:
        - email
        - joined_at
    WaitlistEntriesResult:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistEntry"
        total:
          type: integer
      required:
        - entries
        - total
    WorkspaceInviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [analyst, client_viewer]
      required:
        - email
        - role
    WorkspaceInvite:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        status:
          type: string
        created_at:
          type: string
      required:
        - id
        - email
        - role
        - status
        - created_at
    WorkspaceInviteResult:
      type: object
      properties:
        status:
          type: string
          enum: [created, already_invited]
        invite:
          $ref: "#/components/schemas/WorkspaceInvite"
      required:
        - status
        - invite
    RevokeWorkspaceInviteResult:
      type: object
      properties:
        status:
          type: string
          enum: [revoked]
      required:
        - status
    WorkspaceInviteResendResult:
      type: object
      properties:
        status:
          type: string
          enum: [resent]
        invite:
          $ref: "#/components/schemas/WorkspaceInvite"
      required:
        - status
        - invite
    WorkspaceInvitesResult:
      type: object
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceInvite"
      required:
        - invites
    ChannelPref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        enabled:
          type: boolean
      required:
        - id
        - enabled
    EventPref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        email:
          type: boolean
        in_app:
          type: boolean
      required:
        - id
        - email
        - in_app
    NotificationPrefsUpdateInput:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPref"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventPref"
    NotificationPrefsResult:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPref"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventPref"
      required:
        - channels
        - events
    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

