      required:
        - status
        - invite
    RevokeWorkspaceInviteResult:
      type: object
      properties:
        status:
          type: string
          enum: [revoked]
      required:
        - status
    WorkspaceInviteResendResult:
      type: object
      properties:
        status:
          type: string
          enum: [resent]
