          type: string
          nullable: true
          description: The actual header value found in the CSV, or null if the column was not found.
        confidence:
          type: number
          description: Mapping confidence 0–1. 1.0 = exact match; 0 = not found.
        method:
          type: string
          description: Human-readable label describing how the column was resolved.
        tier:
          type: string
          enum: [exact, resolved, inferred, missing]
          description: "Resolution tier: exact (verbatim), resolved (alias/slug/case), inferred (Jaccard ≥0.5), or missing (not found)."
      required:
        - canonical
        - confidence
        - method
        - tier
