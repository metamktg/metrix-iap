openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrix
    description: Metrix IAP data operations
paths:
  /metrix/seed:
    get:
      operationId: getMetrixSeed
      tags: [metrix]
      summary: Get the Metrix IAP seed bundle
      description: Returns the full Metrix seed bundle (manager account, ad accounts, app defaults) served from the backend. Requires a logged-in session.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The seed bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetrixSeedBundle"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts:
    post:
      operationId: createManualAdAccount
      tags: [metrix]
      summary: Create a manual ad account
      description: Creates a new unconfigured ad account backed by manual report uploads (no live platform connection). The creating user is granted access to the account. The account stays in an honest pending state until the analysis pipeline runs.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdAccountInput"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdAccountResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An account with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: stageManualImport
      tags: [metrix]
      summary: Stage a manual report or creative upload for an ad account
      description: Stores an uploaded file as a staged import for the account. Two performance CSV kinds are required (performance_demo_csv, performance_placement_csv — matching the exact IAP_DEMOGRAPHIC_TEXT_SIGNAL / IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL Meta pivot export templates) plus any number of individually-staged creative_asset files (never a ZIP). Files are staged for the analysis pipeline — they are never parsed into performance data at upload time (no fabricated data). Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualImportInput"
      responses:
        "200":
          description: Import staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The byte-identical file is already staged for this slot — staging it twice would double-count its rows at analysis time. Remove the staged copy first to replace it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The file failed upload-time validation (unreadable, wrong report class, missing required columns, no data rows, or unusable delivery metrics).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listManualImports
      tags: [metrix]
      summary: List staged manual imports for an ad account
      description: Returns every staged manual import (both performance CSV kinds and creative assets) for the account, newest first. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Staged imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListManualImportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/uploads:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: initChunkedManualImportUpload
      tags: [metrix]
      summary: Begin a chunked upload of a large performance report file
      description: Creates an 'uploading' manual import row for a performance report file too large for a single request (the deployment proxy caps request bodies well below the 150 MB file limit). The client then PUTs base64 chunks and finishes with the complete endpoint, which runs the exact same validation as the single-request staging route. Performance CSV kinds only. Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkedUploadInit"
      responses:
        "200":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkedUploadInitResult"
        "400":
          description: Invalid input (unsupported kind, size over 150 MB, bad chunk count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/uploads/{importId}/chunks/{chunkIndex}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: chunkIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    put:
      operationId: uploadManualImportChunk
      tags: [metrix]
      summary: Upload one chunk of a chunked manual import
      description: Stores one base64-encoded chunk (decoded max 16 MB) for an 'uploading' import. Idempotent per (importId, chunkIndex) — re-sending a chunk replaces it. Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkedUploadChunk"
      responses:
        "200":
          description: Chunk stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  chunk_index:
                    type: integer
                required: [status, chunk_index]
        "400":
          description: Invalid chunk (bad base64, empty, over the per-chunk limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Upload session not found or not in 'uploading' state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/uploads/{importId}/complete:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      operationId: completeChunkedManualImportUpload
      tags: [metrix]
      summary: Finish a chunked upload and stage the file
      description: Assembles the uploaded chunks, runs the exact same validation as single-request staging (CSV/XLSX parse, column mapping report, same-bytes duplicate guard), and flips the import to 'staged'. On a validation failure the upload session and its chunks are deleted and the error explains what to fix. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Import staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImportResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Upload session not found or not in 'uploading' state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The byte-identical file is already staged for this slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The assembled file failed validation (missing chunks, malformed CSV/XLSX, wrong report class). The upload session was discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/restage-run/{runId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: runId
        in: path
        required: true
        description: A past manual analysis run identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: restageManualImportsForRun
      tags: [metrix]
      summary: Restage the imports a past analysis run consumed
      description: Flips every manual_imports row this run consumed (status=processed) back to staged and clears the run linkage, so "Run analysis" picks them up again to regenerate the analysis from the same files without re-uploading. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Imports restaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestageManualImportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/{importId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        description: Manual import identifier.
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateManualImportAdNames
      tags: [metrix]
      summary: Edit the ad-name mapping for a staged creative asset
      description: Updates the ad_names mapping for a staged creative_asset import (the ad(s) this creative file represents). Only valid for creative_asset imports.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManualImportAdNamesInput"
      responses:
        "200":
          description: Updated import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImport"
        "400":
          description: Invalid input, or import is not a creative_asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteManualImport
      tags: [metrix]
      summary: Remove a staged manual import
      description: Deletes a staged manual import (performance CSV or creative asset) before it has been consumed by an analysis run. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/{importId}/file:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        description: Manual import identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getManualImportFile
      tags: [metrix]
      summary: Fetch the raw bytes of a staged manual import (creative asset)
      description: Streams the raw file content staged for this import, with its original content type. Used as the `src` of an `<img>`/`<video>` tag directly — not a JSON response. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Raw file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/manual-performance-csv-format:
    get:
      operationId: getManualPerformanceCsvFormat
      tags: [metrix]
      summary: Required template format for the two manual performance CSV uploads
      description: Returns the exact breakdown + metric column requirements for both required CSV classes (IAP_DEMOGRAPHIC_TEXT_SIGNAL and IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL), each with Base metrics (required) plus Ecommerce/Service/App metric groups (optional, never fabricated when absent), and a valid sample CSV per class. Used by the upload UI to show users exactly what to export from Meta Ads Manager.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Column format spec for both CSV classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPerformanceCsvFormat"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/analysis-runs:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listAnalysisRuns
      tags: [metrix]
      summary: List all analysis runs for an account
      description: Returns every analysis run for the account ordered newest-first (running → error → success). Used to let the user pick which analysis run to ground strategy generation in. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of runs (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunListResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: startManualAnalysisRun
      tags: [metrix]
      summary: Manually run analysis over an account's staged performance CSVs
      description: Parses the account's staged performance_csv manual imports into performance data for the selected date window (7d/14d/30d/all — anchored to the latest date found in the uploaded data, not wall-clock time). Never runs automatically on upload — only from this explicit call. Returns 202 with the run id immediately; poll the latest-run endpoint for the outcome, including the exact date range analyzed. Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisInput"
      responses:
        "202":
          description: Analysis run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGenerationResult"
        "400":
          description: Invalid date_range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An analysis run is already in progress, or a staged file looks like a conversion-event export and needs confirm_conversion_export=true to proceed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Prerequisites missing (no staged performance CSV, or none in range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/sync-creative-links:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: syncCreativeLinks
      tags: [metrix]
      summary: Re-sync creative asset links for an account
      description: Re-attempts linking all staged creative assets to their mapped ad names for the account. Useful after correcting an ad_names mapping on an existing upload without re-running the full analysis. Returns counts of linked and unlinked names. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sync complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCreativeLinksResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/cells/{cellId}/creative:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: cellId
        in: path
        required: true
        description: Creative cell identifier (e.g. C2B).
        schema:
          type: string
          minLength: 1
    post:
      operationId: uploadCellCreative
      tags: [metrix]
      summary: Upload a creative asset directly to a cell
      description: Stores a creative image or video against a specific cell identifier, bypassing the ad-name matching flow. Overwrites any previously uploaded cell creative. Busts the seed cache so the Library reflects the new asset immediately. Requires account access.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellCreativeUploadInput"
      responses:
        "200":
          description: Creative uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellCreativeUploadResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getCellCreative
      tags: [metrix]
      summary: Serve the raw bytes of a cell creative
      description: Returns the raw image or video bytes for a manually uploaded cell creative. Returns 404 if no creative has been uploaded for this cell.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Creative file bytes
          content:
            application/*:
              schema:
                type: string
                format: binary
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No creative uploaded for this cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCellCreative
      tags: [metrix]
      summary: Remove a manually uploaded cell creative
      description: Deletes the cell creative override for the given cell, restoring the default creative or the placeholder. Busts the seed cache.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Creative removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellCreativeDeleteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No creative uploaded for this cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/analysis-runs/latest:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getLatestAnalysisRun
      tags: [metrix]
      summary: Latest manual analysis run for an account
      description: Returns the most recent manual analysis run for the account, or null when none exists. Runs stuck in 'running' past the staleness cutoff are honestly flipped to 'error'. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest run (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestAnalysisRunResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/analysis-summary/run/{runId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: runId
        in: path
        required: true
        description: ID of the manual_analysis_run to scope results to.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getAnalysisSummaryByRun
      tags: [metrix]
      summary: Re-aggregate analysis data for a specific analysis run's date window
