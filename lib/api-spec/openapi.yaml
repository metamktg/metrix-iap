      required: [date, spend, impressions, link_clicks, results]
    ReportClassCoverage:
      type: object
      description: Join coverage measured for one report class (upload slot) at analysis time — how much of the account's daily-attributable activity this class's rows represent.
      properties:
        report_class:
          type: string
          enum: [demographic, device_placement, ad_summary, conversion_device]
        rows_scoped: { type: integer, description: "Rows from this class inside the analysis window." }
        distinct_ads: { type: integer, description: "Distinct ad names present in this class's scoped rows." }
        spend: { type: number, nullable: true, description: "Spend carried by this class's scoped rows; null when the class never carries spend (e.g. conversion_device)." }
        spend_coverage_pct: { type: number, nullable: true, description: "spend as % of the run's daily-attributable baseline spend." }
        ad_coverage_pct: { type: number, nullable: true, description: "distinct_ads as % of the baseline's distinct ads." }
        aggregate_shape: { type: boolean, description: "True when the file is a whole-period aggregate export (excluded from daily totals, used for metadata/cross-checks only)." }
        below_threshold: { type: boolean, description: "True when joined-spend coverage falls below threshold_pct — surfaces must warn and downgrade signal classification." }
        note: { type: string, nullable: true, description: "Cause + remedy text, populated when below_threshold or aggregate_shape." }
      required: [report_class, rows_scoped, distinct_ads, spend, spend_coverage_pct, ad_coverage_pct, aggregate_shape, below_threshold, note]
