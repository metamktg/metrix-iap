openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrix
    description: Metrix IAP data operations
paths:
  /metrix/seed:
    get:
      operationId: getMetrixSeed
      tags: [metrix]
      summary: Get the Metrix IAP seed bundle
      description: Returns the full Metrix seed bundle (manager account, ad accounts, app defaults) served from the backend. Requires a logged-in session.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The seed bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetrixSeedBundle"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/agent-waitlist:
    post:
      operationId: joinAgentWaitlist
      tags: [metrix]
      summary: Join the Metrix Agent waitlist
      description: Stores an email address on the Metrix Agent waitlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "200":
          description: Waitlist signup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignupResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listAgentWaitlist
      tags: [metrix]
      summary: List Metrix Agent waitlist signups
      description: Returns a page of waitlist entries (email and joined date), newest first. Use limit/offset to page through results; total reflects the full count. Requires an admin bearer key.
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of entries to skip from the newest entry (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/agent-waitlist/{entryId}/approve:
    parameters:
      - name: entryId
        in: path
        required: true
        description: Waitlist entry identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: approveAgentWaitlistEntry
      tags: [metrix]
      summary: Approve a waitlist entry and provision a user account
      description: Creates (or resets) a user account with a temporary password for the waitlisted email, marks the entry approved, and emails the temporary password to the user. When the email provider is not configured, the temporary password is returned to the admin instead. Requires an admin bearer key.
      security:
        - adminKey: []
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistApprovalResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/login:
    post:
      operationId: authLogin
      tags: [metrix]
      summary: Log in with email and password
      description: Verifies credentials and sets an httpOnly session cookie. Returns the authenticated user, including whether a password change is required before using the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/logout:
    post:
      operationId: authLogout
      tags: [metrix]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResult"
  /metrix/auth/me:
    get:
      operationId: authMe
      tags: [metrix]
      summary: Get the current authenticated user
      description: Returns the user attached to the current session cookie, or 401 when not logged in.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/change-password:
    post:
      operationId: authChangePassword
      tags: [metrix]
      summary: Change the current user's password
      description: Verifies the current password and replaces it. Clears the must-change-password flag and revokes all other sessions for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "400":
          description: Invalid new password or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/request-password-reset:
    post:
      operationId: authRequestPasswordReset
      tags: [metrix]
      summary: Request a password reset link
      description: Always responds neutrally whether or not an account exists for the email (no account enumeration). When an account exists, a single-use reset link (valid ~1 hour) is emailed via the configured provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequestPasswordResetInput"
      responses:
        "200":
          description: Neutral acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRequestPasswordResetResult"
        "400":
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [metrix]
      summary: Complete a password reset with a token
      description: Consumes a single-use reset token from the emailed link and sets a new password. On success, every existing session for the user is revoked; the user must log in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResetPasswordResult"
        "400":
          description: Invalid, expired, or already-used token, or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceInvites
      tags: [metrix]
      summary: List pending workspace invites
      description: Returns invites created for this workspace, newest first. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitesResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceInvite
      tags: [metrix]
      summary: Invite a member to the workspace
      description: Creates a pending invite for the given email and role. Idempotent per workspace and email. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInviteInput"
      responses:
        "200":
          description: Invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: revokeWorkspaceInvite
      tags: [metrix]
      summary: Revoke a pending workspace invite
      description: Deletes the pending invite, freeing its seat. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}/resend:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvite
      tags: [metrix]
      summary: Resend a pending workspace invite
      description: Bumps the invite's created_at timestamp to now and returns the updated invite. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResendResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceMembers
      tags: [metrix]
      summary: List real workspace member accounts
      description: Returns provisioned user accounts (real logins) for this workspace, newest first. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembersResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/notification-prefs:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getNotificationPrefs
      tags: [metrix]
      summary: Get workspace notification preference overrides
      description: Returns persisted channel and event preference overrides for this workspace. Anything not listed falls back to seed defaults on the client. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Notification preference overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateNotificationPrefs
      tags: [metrix]
      summary: Update workspace notification preferences
      description: Upserts channel and/or event preference overrides for this workspace and returns the full set of persisted overrides. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefsUpdateInput"
      responses:
        "200":
          description: Notification preference overrides after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid preference payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/request-access:
    post:
      operationId: submitRequestAccess
      tags: [metrix]
      summary: Submit a Metrix access request
      description: Stores a qualified access request from the public marketing site and triggers an internal notification email. Never exposes any login capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAccessInput"
      responses:
        "200":
          description: Access request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccessResult"
        "400":
          description: Invalid or incomplete request fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Request store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/report-settings:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getReportSettings
      tags: [metrix]
      summary: Get workspace report-builder setting overrides
      description: Returns persisted Report Builder defaults for this workspace. Any null field falls back to the seed's report_builder defaults on the client. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Report settings overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSettingsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateReportSettings
      tags: [metrix]
      summary: Update workspace report-builder settings
      description: Upserts Report Builder default overrides for this workspace and returns the persisted values. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSettingsUpdateInput"
      responses:
        "200":
          description: Report settings after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSettingsResult"
        "400":
          description: Invalid report settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/reports:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceReports
      tags: [metrix]
      summary: List generated reports for the workspace
      description: Returns generated report documents (with their content snapshot) for the workspace, newest first. Clients scope to an ad account by filtering on ad_account_id. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Generated reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceReport
      tags: [metrix]
      summary: Store a generated report document
      description: Persists a generated report snapshot (composed sections and metadata) so it appears in Report History and can be re-downloaded from Exports exactly as generated. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedReportCreateInput"
      responses:
        "200":
          description: Stored generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReportCreateResult"
        "400":
          description: Invalid report payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/reports/{reportId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: reportId
        in: path
        required: true
        description: Generated report identifier.
        schema:
          type: integer
    delete:
      operationId: deleteWorkspaceReport
      tags: [metrix]
      summary: Delete a generated report
      description: Permanently deletes a generated report document (and its stored snapshot) from Report History. Only in-app generated reports can be deleted; seed history entries live in the seed bundle and are not addressable here. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Report deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReportDeleteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Report not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/connection:
    get:
      operationId: getMetaConnection
      tags: [metrix]
      summary: Get the current user's Meta ad account connection status
      description: Returns whether the logged-in user has connected a Meta ad account, pending-selection state after OAuth, and the latest report pull status per report class.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectionStatus"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: disconnectMetaAccount
      tags: [metrix]
      summary: Disconnect the user's Meta ad account
      description: Removes the stored connection and any pending OAuth token for the logged-in user. Stored report pulls and rows are kept.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDisconnectResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/oauth-url:
    get:
      operationId: getMetaOauthUrl
      tags: [metrix]
      summary: Get the Meta OAuth dialog URL
      description: Builds the Facebook OAuth dialog URL (scope ads_read only) with a signed state parameter for the logged-in user. The browser should navigate to the returned URL.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OAuth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaOauthUrlResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Meta app credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/adaccounts:
    get:
      operationId: listMetaAdAccounts
      tags: [metrix]
      summary: List ad accounts available to the connected Meta user
      description: Calls Meta /me/adaccounts with the user's OAuth token (pending or connected) and returns the accounts for selection. In pilot mode, flags whether the required pilot ad account is present.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Available ad accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAdAccountsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No Meta OAuth token available; connect first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Meta API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/select-account:
    post:
      operationId: selectMetaAdAccount
      tags: [metrix]
      summary: Select and save a Meta ad account
      description: Validates the chosen ad account against /me/adaccounts, then persists the connection (encrypted token, account metadata) for the logged-in user.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectMetaAdAccountInput"
      responses:
        "200":
          description: Connection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectMetaAdAccountResult"
        "400":
          description: Invalid ad account id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No Meta OAuth token available; connect first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Meta API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/run-reports:
    post:
      operationId: runMetaReports
      tags: [metrix]
      summary: Run both IAP report pulls for the connected ad account
      description: Pulls IAP_DEMOGRAPHIC_TEXT_SIGNAL and IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL insights (same last_30d range) for the user's connected ad account, normalizes rows into report_rows, and stores token-sanitized raw pages. Reports are stored separately per class; partial failure is reported per class.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pull results per report class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunMetaReportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No connected ad account, or token expired — reconnect required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/report-rows:
    get:
      operationId: listMetaReportRows
      tags: [metrix]
      summary: List normalized report rows for the connected ad account
      description: Returns normalized rows from the most recent successful pull of the given report class for the logged-in user's connected ad account.
      security:
        - cookieAuth: []
      parameters:
        - name: report_class
          in: query
          required: true
          schema:
            type: string
            enum: [IAP_DEMOGRAPHIC_TEXT_SIGNAL, IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Normalized report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaReportRowsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No successful pull exists for this report class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: Static admin key configured via the ADMIN_API_KEY secret.
    cookieAuth:
      type: apiKey
      in: cookie
      name: metrix_session
      description: httpOnly session cookie set by /metrix/auth/login.
  schemas:
    MetrixSeedBundle:
      type: object
      description: Full Metrix IAP seed bundle. Nested account payloads are intentionally loosely typed; the client narrows them with its own seed types.
      additionalProperties: true
      properties:
        schema_version:
          type: string
        generated_at:
          type: string
        integrity_note:
          type: string
        variable_registry:
          type: array
          description: Data-layer truth about variable families, including explicit registry_missing entries (ST_/AW_/CTA_ known gap).
          items:
            type: object
            additionalProperties: true
        app_defaults:
          type: object
          additionalProperties: true
        manager_account:
          type: object
          additionalProperties: true
        ad_accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_settings:
          type: object
          additionalProperties: true
      required:
        - schema_version
        - manager_account
        - ad_accounts
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistSignupResult:
      type: object
      properties:
        status:
          type: string
          enum: [joined, already_joined]
        email:
          type: string
      required:
        - status
        - email
    WaitlistEntry:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        status:
          type: string
          enum: [pending, approved]
        approved_at:
          type: string
          nullable: true
        joined_at:
          type: string
      required:
        - id
        - email
        - status
        - joined_at
    WaitlistApprovalResult:
      type: object
      properties:
        status:
          type: string
          enum: [approved, already_approved]
        email:
          type: string
        email_sent:
          type: boolean
          description: True when the temporary-password email was delivered to the provider.
        temp_password:
          type: string
          description: Present only when the email could not be sent, so the admin can share the temporary password manually.
      required:
        - status
        - email
        - email_sent
    AuthLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        email:
          type: string
        must_change_password:
          type: boolean
      required:
        - email
        - must_change_password
    AuthUserResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user
    AuthLogoutResult:
      type: object
      properties:
        status:
          type: string
          enum: [logged_out]
      required:
        - status
    AuthChangePasswordInput:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 200
        new_password:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - current_password
        - new_password
    AuthRequestPasswordResetInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    AuthRequestPasswordResetResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required:
        - status
    AuthResetPasswordInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        new_password:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - token
        - new_password
    AuthResetPasswordResult:
      type: object
      properties:
        status:
          type: string
          enum: [reset]
      required:
        - status
    WaitlistEntriesResult:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistEntry"
        total:
          type: integer
      required:
        - entries
        - total
    WorkspaceInviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [analyst, client_viewer]
      required:
        - email
        - role
    WorkspaceInvite:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        status:
          type: string
        created_at:
          type: string
      required:
        - id
        - email
        - role
        - status
        - created_at
    WorkspaceInviteResult:
      type: object
      properties:
        status:
