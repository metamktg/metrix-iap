        schema:
          type: string
          minLength: 1
    post:
      operationId: deconstructCreatives
      tags: [metrix]
      summary: Start a creative deconstruction run over uploaded creative assets
      description: Analyzes the selected staged creative_asset uploads (images) against the IAP variable registry, grading each detected variable with a confidence score. Classifications at or above the 80% gate file into the account's local library automatically; below-gate results land in the review queue. Video files are recorded as unsupported. Returns 202 with the run id immediately; poll the latest-run endpoint (kind=deconstruct) for the outcome. Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeconstructCreativesInput"
      responses:
        "202":
          description: Deconstruction run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGenerationResult"
        "400":
          description: No import ids provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A deconstruction run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: None of the selected uploads are creative assets on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
