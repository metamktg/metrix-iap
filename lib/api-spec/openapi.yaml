        - title
        - mode
        - branding
        - export_format
        - section_count
        - summary
        - model_json
    GeneratedReport:
      type: object
      properties:
        id:
          type: integer
        ad_account_id:
          type: string
        title:
          type: string
        mode:
          type: string
        branding:
          type: string
        export_format:
          type: string
        section_count:
          type: integer
        range_start:
          type: string
          nullable: true
        range_end:
          type: string
          nullable: true
        range_source:
          type: string
          nullable: true
        summary:
          type: string
        model_json:
          type: string
        generated_at:
          type: string
      required:
        - id
        - ad_account_id
        - title
        - mode
        - branding
        - export_format
        - section_count
        - range_start
        - range_end
        - range_source
        - summary
        - model_json
        - generated_at
