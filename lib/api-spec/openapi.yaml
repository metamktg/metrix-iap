    GeneratedReportCreateInput:
      type: object
      properties:
        ad_account_id:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 300
        mode:
          type: string
          enum: [internal, client]
        branding:
          type: string
          enum: [metrix, white_label]
        export_format:
          type: string
          enum: [pdf, google_doc, html]
        section_count:
          type: integer
          minimum: 1
        range_start:
          type: string
          nullable: true
          description: ISO date the report window starts; null when no data window existed.
        range_end:
          type: string
          nullable: true
        range_source:
