    get:
      operationId: listAgentWaitlist
      tags: [metrix]
      summary: List Metrix Agent waitlist signups
      description: Returns a page of waitlist entries (email and joined date), newest first. Use limit/offset to page through results; total reflects the full count. Requires an admin bearer key.
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of entries to skip from the newest entry (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          required: false
          description: Optional email search filter (case-insensitive substring match). When supplied, only entries whose email contains this string are returned, and total reflects the filtered count.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResult"
        "401":
