        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectMetaAdAccountInput"
      responses:
        "200":
          description: Connection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectMetaAdAccountResult"
        "400":
          description: Invalid ad account id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No Meta OAuth token available; connect first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Meta API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/run-reports:
    post:
      operationId: runMetaReports
      tags: [metrix]
      summary: Run both IAP report pulls for the connected ad account
      description: Pulls IAP_DEMOGRAPHIC_TEXT_SIGNAL and IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL insights (same last_30d range) for the user's connected ad account, normalizes rows into report_rows, and stores token-sanitized raw pages. Reports are stored separately per class; partial failure is reported per class.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pull results per report class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunMetaReportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No connected ad account, or token expired — reconnect required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/report-rows:
    get:
      operationId: listMetaReportRows
      tags: [metrix]
      summary: List normalized report rows for the connected ad account
      description: Returns normalized rows from the most recent successful pull of the given report class for the logged-in user's connected ad account.
      security:
        - cookieAuth: []
      parameters:
        - name: report_class
          in: query
          required: true
          schema:
            type: string
            enum: [IAP_DEMOGRAPHIC_TEXT_SIGNAL, IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Normalized report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaReportRowsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No successful pull exists for this report class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: Static admin key configured via the ADMIN_API_KEY secret.
    cookieAuth:
      type: apiKey
      in: cookie
      name: metrix_session
      description: httpOnly session cookie set by /metrix/auth/login.
  schemas:
    MetrixSeedBundle:
      type: object
      description: Full Metrix IAP seed bundle. Nested account payloads are intentionally loosely typed; the client narrows them with its own seed types.
      additionalProperties: true
      properties:
        schema_version:
          type: string
        generated_at:
          type: string
        integrity_note:
          type: string
        concept_registry:
          type: object
          description: Global map of concept code → descriptor entry. Keys are concept codes (e.g. "C2B", "C4E") present across all accounts. Used by ConceptChip to render human-readable labels without hard-coding them on the client.
          additionalProperties:
            $ref: "#/components/schemas/ConceptDescriptorEntry"
        variable_registry:
          type: array
          description: Data-layer truth about variable families, including explicit registry_missing entries (ST_/AW_/CTA_ known gap).
          items:
            type: object
            additionalProperties: true
        app_defaults:
          type: object
          additionalProperties: true
        manager_account:
          type: object
          additionalProperties: true
        ad_accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_settings:
          type: object
          additionalProperties: true
      required:
        - schema_version
        - manager_account
        - ad_accounts
    ConceptDescriptorEntry:
      type: object
      description: Human-readable descriptor for a single concept code, assembled from concept_intelligence and library_cells at seed-assembly time.
      properties:
        code:
          type: string
          description: The concept code (e.g. "C2B", "C4E").
        descriptor:
          type: string
          description: Plain-text human label (e.g. "Authority · Static × Checkout Depth").
        book:
          type: string
          nullable: true
          description: Book identifier if applicable (BOOK0, BOOK2, or null).
        what:
          type: string
          nullable: true
          description: What this concept does / produced (from concept_intelligence.what).
        why:
          type: string
          nullable: true
          description: Why it works (from concept_intelligence.why).
        source_cells:
          type: array
          items:
            type: string
          description: Library cell IDs that map to this concept (used for Library drill-in navigation).
      required:
        - code
        - descriptor
        - source_cells
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistSignupResult:
      type: object
      properties:
        status:
          type: string
          enum: [joined, already_joined]
        email:
          type: string
      required:
        - status
        - email
    WaitlistEntry:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        approved_at:
          type: string
          nullable: true
        joined_at:
          type: string
      required:
        - id
        - email
        - status
        - joined_at
    WaitlistRejectResult:
      type: object
      properties:
        status:
          type: string
          enum: [rejected, already_rejected]
        email:
          type: string
      required:
        - status
        - email
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - password
    AdminSessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    RequestAccessEntry:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        avg_monthly_ad_spend:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        linkedin:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
      required:
        - id
        - full_name
        - email
        - status
        - created_at
    RequestAccessEntriesResult:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RequestAccessEntry"
        total:
          type: integer
      required:
        - entries
        - total
    WaitlistApprovalResult:
      type: object
      properties:
        status:
          type: string
          enum: [approved, already_approved]
        email:
          type: string
        email_sent:
          type: boolean
          description: True when the temporary-password email was delivered to the provider.
        temp_password:
          type: string
          description: Present only when the email could not be sent, so the admin can share the temporary password manually.
        email_error:
          type: string
          description: Present only when the email could not be sent — explains why (e.g. sandbox sender limitation) and how to fix it.
      required:
        - status
        - email
        - email_sent
    AdminEmailStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [missing_key, sandbox, configured]
          description: missing_key = no RESEND_API_KEY, delivery disabled; sandbox = sandbox sender, delivery only to the Resend account owner; configured = custom verified sender.
        from:
          type: string
          description: The from-address outbound email uses.
        environment:
          type: string
          enum: [development, production]
          description: Which environment this server (and its user database) is — approvals only create accounts in the environment where they are performed.
      required:
        - mode
        - from
        - environment
    AdminUser:
      type: object
      properties:
        id:
