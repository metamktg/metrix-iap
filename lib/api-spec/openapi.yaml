          minLength: 1
    patch:
      operationId: reviewCreativeDeconstruction
      tags: [metrix]
      summary: Review a below-gate creative classification
      description: Applies a review action to a classification in the review queue. 'update_variables' replaces the stored variable set (registry-constrained, recorded as user-edited); 'bypass' explicitly overrides the confidence gate and files the entry into the local library (recorded as user_overridden); 'discard' rejects the classification and removes anything previously filed. Requires access to the account.
