    ReportSettingsResult:
      type: object
      properties:
        default_branding:
          type: string
          nullable: true
        default_format:
          type: string
          nullable: true
        default_mode:
          type: string
          nullable: true
        schedule_enabled:
          type: boolean
          nullable: true
        schedule_cadence:
          type: string
          nullable: true
        schedule_recipients:
          type: string
          nullable: true
      required:
        - default_branding
        - default_format
        - default_mode
        - schedule_enabled
        - schedule_cadence
        - schedule_recipients
    NotificationPrefsUpdateInput:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPref"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventPref"
    NotificationPrefsResult:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPref"
        events:
