    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: backfillDeconstructCreatives
      tags: [metrix]
      summary: Classify every unclassified uploaded creative on the account in one bulk run
      description: Starts a deconstruction run over every creative_asset manual import on the account that has no non-discarded classification (never previously classified, or previously discarded). The run is chunked with pauses to respect model rate limits, and per-item progress (progress_done of progress_total) is reported on the latest-run endpoint (kind=deconstruct). Results flow through the same 80% confidence gate and review queue as targeted deconstruction. Returns 202 with the run id and the number of targeted imports. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "202":
          description: Bulk deconstruction backfill started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartDeconstructBackfillResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A deconstruction run is already in progress, or every uploaded creative already has a classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
