        report_class:
          type: string
          enum: [IAP_DEMOGRAPHIC_TEXT_SIGNAL, IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL]
        status:
          type: string
          enum: [success, error]
        fetched_at:
