openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrix
    description: Metrix IAP data operations
paths:
  /metrix/seed:
    get:
      operationId: getMetrixSeed
      tags: [metrix]
      summary: Get the Metrix IAP seed bundle
      description: Returns the full Metrix seed bundle (manager account, ad accounts, app defaults) served from the backend.
      responses:
        "200":
          description: The seed bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetrixSeedBundle"
  /metrix/agent-waitlist:
    post:
      operationId: joinAgentWaitlist
      tags: [metrix]
      summary: Join the Metrix Agent waitlist
      description: Stores an email address on the Metrix Agent waitlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "200":
          description: Waitlist signup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignupResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listAgentWaitlist
      tags: [metrix]
      summary: List Metrix Agent waitlist signups
      description: Returns a page of waitlist entries (email and joined date), newest first. Use limit/offset to page through results; total reflects the full count. Requires an admin bearer key.
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of entries to skip from the newest entry (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: Static admin key configured via the ADMIN_API_KEY secret.
  schemas:
    MetrixSeedBundle:
      type: object
      description: Full Metrix IAP seed bundle. Nested account payloads are intentionally loosely typed; the client narrows them with its own seed types.
      additionalProperties: true
      properties:
        schema_version:
          type: string
        generated_at:
          type: string
        app_defaults:
          type: object
          additionalProperties: true
        manager_account:
          type: object
          additionalProperties: true
        ad_accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_settings:
          type: object
          additionalProperties: true
      required:
        - schema_version
        - manager_account
        - ad_accounts
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistSignupResult:
      type: object
      properties:
        status:
          type: string
          enum: [joined, already_joined]
        email:
          type: string
      required:
        - status
        - email
    WaitlistEntry:
      type: object
      properties:
        email:
          type: string
        joined_at:
          type: string
      required:
        - email
        - joined_at
    WaitlistEntriesResult:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistEntry"
        total:
          type: integer
      required:
        - entries
        - total
    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

