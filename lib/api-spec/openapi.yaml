            application/json:
              schema:
                $ref: "#/components/schemas/RunMetaReportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No connected ad account, or token expired — reconnect required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/meta/report-rows:
    get:
      operationId: listMetaReportRows
      tags: [metrix]
      summary: List normalized report rows for the connected ad account
      description: Returns normalized rows from the most recent successful pull of the given report class for the logged-in user's connected ad account.
      security:
        - cookieAuth: []
      parameters:
        - name: report_class
          in: query
          required: true
          schema:
            type: string
            enum: [IAP_DEMOGRAPHIC_TEXT_SIGNAL, IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Normalized report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaReportRowsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No successful pull exists for this report class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: Static admin key configured via the ADMIN_API_KEY secret.
    cookieAuth:
      type: apiKey
      in: cookie
      name: metrix_session
      description: httpOnly session cookie set by /metrix/auth/login.
  schemas:
    MetrixSeedBundle:
      type: object
      description: Full Metrix IAP seed bundle. Nested account payloads are intentionally loosely typed; the client narrows them with its own seed types.
      additionalProperties: true
      properties:
        schema_version:
          type: string
        generated_at:
          type: string
        integrity_note:
          type: string
        concept_registry:
          type: object
          description: Global map of concept code → descriptor entry. Keys are concept codes (e.g. "C2B", "C4E") present across all accounts. Used by ConceptChip to render human-readable labels without hard-coding them on the client.
          additionalProperties:
            $ref: "#/components/schemas/ConceptDescriptorEntry"
        variable_registry:
          type: array
          description: Data-layer truth about variable families, including explicit registry_missing entries (ST_/AW_/CTA_ known gap).
          items:
            type: object
            additionalProperties: true
        app_defaults:
          type: object
          additionalProperties: true
        manager_account:
          type: object
          additionalProperties: true
        ad_accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_settings:
          type: object
          additionalProperties: true
      required:
        - schema_version
        - manager_account
        - ad_accounts
    ConceptDescriptorEntry:
      type: object
      description: Human-readable descriptor for a single concept code, assembled from concept_intelligence and library_cells at seed-assembly time.
      properties:
        code:
          type: string
          description: The concept code (e.g. "C2B", "C4E").
        descriptor:
          type: string
          description: Plain-text human label (e.g. "Authority · Static × Checkout Depth").
        book:
          type: string
          nullable: true
          description: Book identifier if applicable (BOOK0, BOOK2, or null).
        what:
          type: string
          nullable: true
          description: What this concept does / produced (from concept_intelligence.what).
        why:
          type: string
          nullable: true
          description: Why it works (from concept_intelligence.why).
        source_cells:
          type: array
          items:
            type: string
          description: Library cell IDs that map to this concept (used for Library drill-in navigation).
      required:
        - code
        - descriptor
        - source_cells
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistSignupResult:
      type: object
      properties:
        status:
          type: string
          enum: [joined, already_joined]
        email:
          type: string
      required:
        - status
        - email
    WaitlistEntry:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        approved_at:
          type: string
          nullable: true
        joined_at:
          type: string
      required:
        - id
        - email
        - status
        - joined_at
    WaitlistRejectResult:
      type: object
      properties:
        status:
          type: string
          enum: [rejected, already_rejected]
        email:
          type: string
      required:
        - status
        - email
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - password
    AdminSessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    RequestAccessEntry:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        avg_monthly_ad_spend:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        linkedin:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
      required:
        - id
        - full_name
        - email
        - status
        - created_at
    RequestAccessEntriesResult:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RequestAccessEntry"
        total:
          type: integer
      required:
        - entries
        - total
    WaitlistApprovalResult:
      type: object
      properties:
        status:
          type: string
          enum: [approved, already_approved]
        email:
          type: string
        email_sent:
          type: boolean
          description: True when the temporary-password email was delivered to the provider.
        temp_password:
          type: string
          description: Present only when the email could not be sent, so the admin can share the temporary password manually.
        email_error:
          type: string
          description: Present only when the email could not be sent — explains why (e.g. sandbox sender limitation) and how to fix it.
      required:
        - status
        - email
        - email_sent
    AdminEmailStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [missing_key, sandbox, configured]
          description: missing_key = no RESEND_API_KEY, delivery disabled; sandbox = sandbox sender, delivery only to the Resend account owner; configured = custom verified sender.
        from:
          type: string
          description: The from-address outbound email uses.
        environment:
          type: string
          enum: [development, production]
          description: Which environment this server (and its user database) is — approvals only create accounts in the environment where they are performed.
      required:
        - mode
        - from
        - environment
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, invited, disabled]
          description: invited = provisioned but never logged in; disabled = access revoked.
        role:
          type: string
          enum: [admin, member]
        must_change_password:
          type: boolean
        created_at:
          type: string
        last_login_at:
          type: string
          nullable: true
        disabled_at:
          type: string
          nullable: true
        ad_account_ids:
          type: array
          items:
            type: string
          description: Ad account IDs this user is explicitly granted. Empty for admin-role users (they always see all accounts by role).
      required:
        - id
        - email
        - status
        - must_change_password
        - created_at
        - ad_account_ids
    AdminUsersResult:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
      required:
        - users
        - total
    AdminResendTempPasswordResult:
      type: object
      properties:
        status:
          type: string
          enum: [resent]
        email:
          type: string
        email_sent:
          type: boolean
        temp_password:
          type: string
          description: Present only when the email could not be sent, so the admin can share the temporary password manually.
        email_error:
          type: string
          description: Present only when the email could not be sent — explains why and how to fix it.
      required:
        - status
        - email
        - email_sent
    AdminSendPasswordResetResult:
      type: object
      properties:
        status:
          type: string
          enum: [reset_link_created]
        email:
          type: string
        email_sent:
          type: boolean
        reset_url:
          type: string
          description: Present only when the email could not be sent, so the admin can share the single-use reset link manually. Expires in 1 hour.
        email_error:
          type: string
          description: Present only when the email could not be sent — explains why and how to fix it.
      required:
        - status
        - email
        - email_sent
    AdminUserActionResult:
      type: object
      properties:
        status:
          type: string
          enum: [revoked, restored]
        email:
          type: string
      required:
        - status
        - email
    AdminAdAccount:
      type: object
      properties:
        id:
          type: string
          description: Ad account identifier (e.g. "act_123" or "manual_xyz").
        name:
          type: string
          nullable: true
          description: Human-readable account name from the Metrix seed.
      required:
        - id
    AdminAdAccountsResult:
      type: object
      properties:
        ad_accounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminAdAccount"
      required:
        - ad_accounts
    AdminCreateUserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          description: Optional friendly display name shown in the admin user list.
        role:
          type: string
          enum: [admin, member]
          description: Defaults to member when omitted.
        ad_account_ids:
          type: array
          items:
            type: string
          description: Ad account grant list for the new user. Ignored for admin-role users (they always see all accounts). Unknown ids are silently skipped.
      required:
        - email
    AdminCreateUserResult:
      type: object
      properties:
        status:
          type: string
          enum: [created]
        email:
          type: string
        user_id:
          type: integer
        email_sent:
          type: boolean
        temp_password:
          type: string
          description: Present only when the email could not be sent, so the admin can share the temp password manually.
        email_error:
          type: string
          description: Present only when the email could not be sent — explains why and how to fix it.
      required:
        - status
        - email
        - user_id
        - email_sent
    AdminDeleteUserResult:
      type: object
      properties:
        status:
          type: string
          enum: [deleted]
        email:
          type: string
      required:
        - status
        - email
    AdminUserAdAccountsResult:
      type: object
      properties:
        ad_account_ids:
          type: array
          items:
            type: string
      required:
        - ad_account_ids
    AdminUpdateUserAdAccountsInput:
      type: object
      properties:
        ad_account_ids:
          type: array
          items:
            type: string
      required:
        - ad_account_ids
    AuthLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
        rememberMe:
          type: boolean
          default: false
          description: When true, the session cookie is set with a 30-day Max-Age. When false (default), the cookie is a session cookie cleared when the browser closes.
      required:
        - email
        - password
    CreateAdAccountInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Display name for the ad account (e.g. the client or brand name).
      required:
        - name
    CreateAdAccountResult:
      type: object
      properties:
        account_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [unconfigured]
      required:
        - account_id
        - name
        - status
    ManualImportInput:
      type: object
      properties:
        kind:
          type: string
          enum: [performance_demo_csv, performance_placement_csv, performance_ad_summary_csv, performance_conversion_device_csv, creative_asset]
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          description: Original MIME type of the uploaded file, if known.
        content_base64:
          type: string
          description: Base64-encoded file content. Max 50 MB decoded.
          minLength: 1
        ad_names:
          type: array
          description: For creative_asset uploads only — the ad name(s) this creative is mapped to.
          items:
            type: string
        match_method:
          type: string
          description: How ad_names was auto-suggested at stage time (id code, confident filename similarity, or low-confidence closest guess), if at all.
          enum: [id, fuzzy, guess]
      required:
        - kind
        - filename
        - content_base64
    CreativeLinkResult:
      type: object
      description: Per-file result of linking a staged creative asset to its ad name(s).
      properties:
        matched:
          type: array
          description: Ad names that resolved to a real ad row and were linked to this asset.
          items:
            type: string
        unmatched:
          type: array
          description: Ad names with no matching ad row — the asset is staged but not linked to a live ad.
          items:
            type: string
      required:
        - matched
        - unmatched
    ColumnMappingSummaryEntry:
      type: object
      description: Per-canonical column mapping result included in the upload staging response. Covers every breakdown and base metric column so the client can render a full column-mapping report.
      properties:
        canonical:
          type: string
          description: The canonical column name from the IAP spec.
        found_as:
          type: string
          nullable: true
          description: The actual header value found in the CSV, or null if the column was not found.
        confidence:
          type: number
          description: Mapping confidence 0–1. 1.0 = exact match; 0 = not found.
        method:
          type: string
          description: Human-readable label describing how the column was resolved.
        tier:
          type: string
          enum: [exact, resolved, inferred, missing]
          description: "Resolution tier: exact (verbatim), resolved (alias/slug/case), inferred (Jaccard ≥0.5), or missing (not found)."
        is_required:
          type: boolean
          description: "True when this column is listed in the spec's requiredBreakdownColumns for this CSV class. A missing required column will cause the analysis run to produce incomplete or failed results — not just reduced confidence."
      required:
        - canonical
        - confidence
        - method
        - tier
        - is_required
    ChunkedUploadInit:
      type: object
      properties:
        kind:
          type: string
          enum: [performance_demo_csv, performance_placement_csv, performance_ad_summary_csv, performance_conversion_device_csv]
          description: Performance report kinds only — creative assets use single-request staging.
        filename:
          type: string
          minLength: 1
        content_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          minimum: 1
          description: Total file size in bytes (max 150 MB). Verified against the assembled chunks at completion.
        chunk_count:
          type: integer
          minimum: 1
          description: Number of chunks the client will send (max 64).
      required: [kind, filename, size_bytes, chunk_count]
    ChunkedUploadInitResult:
      type: object
      properties:
        status:
          type: string
          enum: [uploading]
        import_id:
          type: string
        max_chunk_bytes:
          type: integer
          description: Decoded per-chunk byte ceiling the server will accept.
      required: [status, import_id, max_chunk_bytes]
    ChunkedUploadChunk:
      type: object
      properties:
        content_base64:
          type: string
          minLength: 1
      required: [content_base64]
    ManualImportResult:
      type: object
      properties:
        status:
          type: string
          enum: [staged]
        import_id:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
        note:
          type: string
          description: Honest processing note (staged for analysis, not parsed into performance data).
        link_result:
          $ref: "#/components/schemas/CreativeLinkResult"
        mapping_summary:
          type: array
          description: Column mapping results for performance CSV uploads (absent for creative_asset uploads). Covers every canonical breakdown and base metric column.
          items:
            $ref: "#/components/schemas/ColumnMappingSummaryEntry"
        upload_warnings:
          type: array
          nullable: true
          description: Warnings from CSV upload-time validation (e.g. the file looks like a conversion-event export rather than a delivery export). The upload is staged — this is informational only.
          items:
            type: string
      required:
        - status
        - import_id
        - filename
        - size_bytes
        - note
    ManualImport:
      type: object
      properties:
        id:
          type: string
        account_id:
          type: string
        kind:
          type: string
          enum: [performance_demo_csv, performance_placement_csv, performance_ad_summary_csv, performance_conversion_device_csv, creative_asset]
        filename:
          type: string
        content_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
        ad_names:
          type: array
          items:
            type: string
        match_method:
          type: string
          description: How ad_names was auto-suggested at stage time (id code, confident filename similarity, or low-confidence closest guess), if it still matches the saved mapping. Cleared once the mapping is overridden.
          nullable: true
          enum: [id, fuzzy, guess]
        status:
          type: string
          enum: [staged, processed, rejected]
        manual_analysis_run_id:
          type: string
          description: The analysis run that consumed this import (status=processed), if any. Null for staged/rejected imports and for creative_asset uploads, which are never run-consumed.
          nullable: true
        created_at:
          type: string
        link_result:
          $ref: "#/components/schemas/CreativeLinkResult"
        mapping_summary:
          type: array
          description: Column mapping results stored at upload time for performance CSV imports (absent for creative_asset uploads). Used to surface column health warnings at the 'Run analysis' step and to re-hydrate the mapping panel on subsequent visits without re-uploading.
          nullable: true
          items:
            $ref: "#/components/schemas/ColumnMappingSummaryEntry"
        upload_warnings:
          type: array
          description: >-
            Warnings recorded by upload-time validation, persisted so they outlive the upload dialog.
            NULL and [] mean different things and must not be conflated: NULL is "not recorded" (a
            creative_asset row, or a file staged before warnings were persisted) and must never render
            as "no warnings"; [] is "validation ran and found none", which is a real positive finding.
          nullable: true
          items:
            type: string
      required:
        - id
        - account_id
        - kind
        - filename
        - size_bytes
        - ad_names
        - status
        - created_at
    RestageManualImportsResult:
      type: object
      properties:
        restaged:
          type: integer
          description: Number of manual_imports rows flipped from processed back to staged.
      required:
        - restaged
    ListManualImportsResult:
      type: object
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/ManualImport"
      required:
        - imports
    UpdateManualImportAdNamesInput:
      type: object
      properties:
        ad_names:
          type: array
          items:
            type: string
        match_method:
          type: string
          description: How ad_names was auto-suggested (id code, confident filename similarity, or low-confidence closest guess), if this update is re-saving an unmodified suggestion. Omit or leave unset for a manual override — the server does not infer this.
          nullable: true
          enum: [id, fuzzy, guess]
      required:
        - ad_names
    IapCsvColumnGroup:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        columns:
          type: array
          items:
            type: string
      required:
        - name
        - required
        - columns
    IapCsvClassFormat:
      type: object
      properties:
        report_name:
          type: string
          description: Exact Meta pivot report template name this CSV must match.
        breakdown_columns:
          type: array
          items:
            type: string
        metric_groups:
          type: array
          items:
            $ref: "#/components/schemas/IapCsvColumnGroup"
        sample_csv:
          type: string
      required:
        - report_name
        - breakdown_columns
        - metric_groups
        - sample_csv
    ColumnAliasEntry:
      type: object
      description: A single canonical column name paired with the known alias variants the CSV parser accepts in its place.
      properties:
        canonical:
          type: string
          description: The exact column name as required by the Metrix spec (currency placeholder resolved to plain label for display).
        aliases:
          type: array
          items:
            type: string
          description: Alias variants accepted by the CSV parser (title-cased for readability).
      required:
        - canonical
        - aliases
    ManualPerformanceCsvFormat:
      type: object
      properties:
        demographic:
          $ref: "#/components/schemas/IapCsvClassFormat"
        device_placement:
          $ref: "#/components/schemas/IapCsvClassFormat"
        ad_summary:
          $ref: "#/components/schemas/IapCsvClassFormat"
        conversion_device:
          $ref: "#/components/schemas/IapCsvClassFormat"
          description: Format spec for the optional Conversion Device pivot export (conversion-only metrics, no spend/impressions). Upload to the performance_conversion_device_csv slot.
        column_aliases:
          type: array
          items:
            $ref: "#/components/schemas/ColumnAliasEntry"
          description: Known accepted column name variants for the most commonly misnamed columns, derived from the server COLUMN_ALIASES map. Collapsed reference guide for the upload UI.
      required:
        - demographic
        - device_placement
        - ad_summary
        - column_aliases
    StartAnalysisInput:
      type: object
      properties:
        date_range:
          type: string
          enum: [7d, 14d, 30d, all]
          description: Date window to analyze, anchored to the latest date found in the uploaded data (not wall-clock time). "all" analyzes every uploaded date.
        confirm_conversion_export:
          type: boolean
          description: Pass true to proceed anyway after a prior call was rejected with a 409 conversion_export_confirmation_required error. Omit or leave false on the first attempt.
      required:
        - date_range
    AnalysisRun:
      type: object
      properties:
        id:
          type: string
        account_id:
          type: string
        status:
          type: string
          enum: [running, success, error]
        date_range:
          type: string
          enum: [7d, 14d, 30d, all]
        date_start:
          type: string
          nullable: true
          description: Resolved start date actually covered by this run (from the data itself).
        date_end:
          type: string
          nullable: true
          description: Resolved end date actually covered by this run (from the data itself).
        rows_ingested:
          type: integer
          nullable: true
        imports_used:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
        finished_at:
          type: string
          nullable: true
        creatives_linked:
          type: integer
          nullable: true
          description: Number of staged creative assets successfully linked to ad rows (computed live from current DB state).
        creatives_total:
          type: integer
          nullable: true
          description: Total number of staged creative asset ad-name mappings attempted.
        creatives_unlinked_names:
          type: array
          items:
            type: string
          nullable: true
          description: Ad names from staged creative assets that could not be matched to any ads row.
        csv_warnings:
          type: array
          items:
            type: string
          nullable: true
          description: Warnings produced during tolerant CSV column matching (auto-resolved aliases, missing columns, unrecognised columns that might map to expected ones). Null when parsing was clean. Present on successful runs that had non-fatal column issues.
        objectives_assessed:
          type: array
          items:
            type: string
          nullable: true
          description: Configured objectives (Settings → General) whose required CSV column groups were present in this run's uploads and were therefore assessed. Null on legacy runs recorded before objective-aware analysis.
        objective_flags:
          type: array
          items:
            type: string
          nullable: true
          description: Non-blocking objective coverage notices — configured objectives skipped this run because their columns were absent (never fabricated), and detected column groups whose objective is not configured (a suggestion; never auto-enabled). Null when coverage matched exactly.
        progress_pct:
          type: integer
          description: Live progress percentage (0–100) while the run is executing. Updated at each pipeline stage. 0 when idle or just started; 100 on success.
        progress_stage:
          type: string
          description: Human-readable label for the current pipeline stage (e.g. "Parsing demographics export"). Empty string when idle or complete.
        reconciliation:
          type: array
          description: >-
            Intended to cross-check the demographic export's totals against the
            placement export's totals for this run. NOT CURRENTLY POPULATED — no
            server code writes it and `import_metric_reconciliation` has no
            writer, so this is always absent. Declared optional rather than
            required for exactly that reason: a required field the server never
            sends is a contract that lies, and consumers must not assume it is
            present. The equivalent integrity check that DOES run today is the
            over-baseline guard in `computeDataCoverage`, surfaced through
            `data_coverage` and the run's csv_warnings. Treat this field as
            reserved; if the writer is implemented, move it back to `required`.
          items:
            $ref: "#/components/schemas/ReconciliationRow"
