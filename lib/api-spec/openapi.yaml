        baseline_spend: { type: number, description: "Sum of spend across the run's merged daily ad rows — the daily-attributable baseline." }
        baseline_distinct_ads: { type: integer }
        threshold_pct: { type: number, description: "Coverage % below which a class is not trustworthy enough to classify segments from." }
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ReportClassCoverage"
      required: [window, baseline_spend, baseline_distinct_ads, threshold_pct, classes]
