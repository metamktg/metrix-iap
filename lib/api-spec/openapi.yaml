                $ref: "#/components/schemas/ApiError"
  /metrix/admin/session:
    post:
      operationId: adminLogin
      tags: [metrix]
      summary: Log in to the admin panel with the admin password
      description: Verifies the admin panel password and sets a short-lived httpOnly admin cookie. Fails closed when the admin password is not configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Wrong password or admin access not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getAdminSession
      tags: [metrix]
      summary: Check whether an admin session is active
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
    delete:
      operationId: adminLogout
      tags: [metrix]
      summary: End the admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /metrix/admin/email-status:
    get:
      operationId: getAdminEmailStatus
      tags: [metrix]
      summary: Report the email delivery configuration
      description: Reports whether outbound email is fully configured, limited to the sandbox sender (delivery only to the Resend account owner), or disabled because no API key is set. Also reports which environment (development or production) this server is running in, since each environment has its own user database. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Email delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailStatus"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users:
    get:
      operationId: listAdminUsers
      tags: [metrix]
      summary: List provisioned user accounts
      description: Returns all provisioned user accounts with their status (active, invited, or disabled), newest first. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Provisioned users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAdminUser
      tags: [metrix]
      summary: Provision a user account directly (without a waitlist entry)
      description: Creates a new user account (or re-provisions an existing one), optionally assigning a role and ad account grants. Generates a temp password, emails it if Resend is configured, and returns it for manual sharing when email fails. Requires admin access.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserInput"
      responses:
        "200":
          description: User created / re-provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateUserResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/resend-temp-password:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminResendTempPassword
      tags: [metrix]
      summary: Issue a new temporary password and email it
      description: Generates a fresh temporary password, forces a password change on next login, revokes all of the user's sessions, and emails the new temporary password. When the email cannot be delivered, the temporary password is returned so the admin can share it manually. Refuses (409) for disabled accounts — restore access first. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResendTempPasswordResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Account is disabled — restore access first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/send-password-reset:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminSendPasswordReset
      tags: [metrix]
      summary: Send the user a password reset link
      description: Creates a single-use, 1-hour password reset link and emails it to the user. Their current password keeps working until the link is used. When the email cannot be delivered, the link is returned so the admin can share it manually. Refuses (409) for disabled accounts. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Reset link result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSendPasswordResetResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Account is disabled — restore access first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/revoke:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminRevokeUser
      tags: [metrix]
      summary: Revoke a user's access
      description: Disables the account and immediately destroys all of its sessions. The user can no longer log in, use existing sessions, or reset their password. Reversible via restore or re-approval. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Revoke result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserActionResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/restore:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminRestoreUser
      tags: [metrix]
      summary: Restore a revoked user's access
      description: Re-enables a disabled account. The user's existing password keeps working (sessions were destroyed at revoke time, so they must log in again). Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserActionResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/ad-accounts:
    get:
      operationId: listAdminAdAccounts
      tags: [metrix]
      summary: List all known ad accounts (for the admin grant picker)
      description: Returns all ad accounts from the Metrix data layer so the admin console can populate the ad account picker when adding users or managing grants. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: All known ad accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdAccountsResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Metrix data layer unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: deleteAdminUser
      tags: [metrix]
      summary: Hard-delete a user account
      description: Permanently deletes the user row, all their sessions, ad account grants, and password reset tokens. Irreversible. Must pass `?confirm=true` as a query param. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeleteUserResult"
        "400":
          description: Missing or invalid confirm param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/ad-accounts:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getAdminUserAdAccounts
      tags: [metrix]
      summary: Get a user's current ad account grants
      description: Returns the list of ad account ids this user has been granted access to. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Current grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAdAccountsResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAdminUserAdAccounts
      tags: [metrix]
      summary: Replace a user's ad account grants
      description: Replaces the user's full grant list with the submitted ad_account_ids array. Pass an empty array to clear all grants. Unknown account ids are silently skipped. Requires admin access.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserAdAccountsInput"
      responses:
        "200":
          description: Updated grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAdAccountsResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/request-access/{requestId}/approve:
    parameters:
      - name: requestId
        in: path
        required: true
        description: Access request identifier (UUID).
        schema:
          type: string
    post:
      operationId: approveRequestAccessEntry
      tags: [metrix]
      summary: Approve an access request and provision a user account
      description: Creates (or resets) a user account with a temporary password for the requester, marks the request approved, and emails the temporary password. When the email provider is not configured, the temporary password is returned to the admin instead. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistApprovalResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/request-access/{requestId}/reject:
    parameters:
      - name: requestId
        in: path
        required: true
        description: Access request identifier (UUID).
        schema:
          type: string
    post:
      operationId: rejectRequestAccessEntry
      tags: [metrix]
      summary: Reject an access request
      description: Marks a pending access request as rejected. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistRejectResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/sessions:
    get:
      operationId: listMySessions
      tags: [metrix]
      summary: List the current user's active sessions
      description: Returns every non-expired session for the logged-in user, flagging which one is the caller's own. Used by Settings → Security.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: revokeMySession
      tags: [metrix]
      summary: Revoke one of the current user's own sessions
      description: Deletes the session by id — scoped to the caller's own sessions only, never another user's. Revoking the session behind the current request signs that browser out.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSessionResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Session not found (already revoked, or not yours)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/login:
    post:
      operationId: authLogin
      tags: [metrix]
      summary: Log in with email and password
      description: Verifies credentials and sets an httpOnly session cookie. Returns the authenticated user, including whether a password change is required before using the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/logout:
    post:
      operationId: authLogout
      tags: [metrix]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResult"
  /metrix/auth/me:
    get:
      operationId: authMe
      tags: [metrix]
      summary: Get the current authenticated user
      description: Returns the user attached to the current session cookie, or 401 when not logged in.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/change-password:
    post:
      operationId: authChangePassword
      tags: [metrix]
      summary: Change the current user's password
      description: Verifies the current password and replaces it. Clears the must-change-password flag and revokes all other sessions for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "400":
          description: Invalid new password or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/request-password-reset:
    post:
      operationId: authRequestPasswordReset
      tags: [metrix]
      summary: Request a password reset link
      description: Always responds neutrally whether or not an account exists for the email (no account enumeration). When an account exists, a single-use reset link (valid ~1 hour) is emailed via the configured provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequestPasswordResetInput"
      responses:
        "200":
          description: Neutral acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRequestPasswordResetResult"
        "400":
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [metrix]
      summary: Complete a password reset with a token
      description: Consumes a single-use reset token from the emailed link and sets a new password. On success, every existing session for the user is revoked; the user must log in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResetPasswordResult"
        "400":
          description: Invalid, expired, or already-used token, or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/register:
    post:
      operationId: authRegister
      tags: [metrix]
      summary: Create a new user account
      description: Creates a new user account and immediately logs the user in by setting a session cookie. Returns the new authenticated user. Rejects with 409 when the email is already in use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "200":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "400":
          description: Invalid input (email format, password too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceInvites
      tags: [metrix]
      summary: List pending workspace invites
      description: Returns invites created for this workspace, newest first. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitesResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceInvite
      tags: [metrix]
      summary: Invite a member to the workspace
      description: Creates a pending invite for the given email and role. Idempotent per workspace and email. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInviteInput"
      responses:
        "200":
          description: Invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: revokeWorkspaceInvite
      tags: [metrix]
      summary: Revoke a pending workspace invite
      description: Deletes the pending invite, freeing its seat. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}/resend:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvite
      tags: [metrix]
      summary: Resend a pending workspace invite
      description: Bumps the invite's created_at timestamp to now and returns the updated invite. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResendResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members/{email}/permissions:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
