openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrix
    description: Metrix IAP data operations
paths:
  /metrix/seed:
    get:
      operationId: getMetrixSeed
      tags: [metrix]
      summary: Get the Metrix IAP seed bundle
      description: Returns the full Metrix seed bundle (manager account, ad accounts, app defaults) served from the backend. Requires a logged-in session.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The seed bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetrixSeedBundle"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts:
    post:
      operationId: createManualAdAccount
      tags: [metrix]
      summary: Create a manual ad account
      description: Creates a new unconfigured ad account backed by manual report uploads (no live platform connection). The creating user is granted access to the account. The account stays in an honest pending state until the analysis pipeline runs.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdAccountInput"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdAccountResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An account with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: stageManualImport
      tags: [metrix]
      summary: Stage a manual report or creative upload for an ad account
      description: Stores an uploaded file as a staged import for the account. Two performance CSV kinds are required (performance_demo_csv, performance_placement_csv — matching the exact IAP_DEMOGRAPHIC_TEXT_SIGNAL / IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL Meta pivot export templates) plus any number of individually-staged creative_asset files (never a ZIP). Files are staged for the analysis pipeline — they are never parsed into performance data at upload time (no fabricated data). Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualImportInput"
      responses:
        "200":
          description: Import staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listManualImports
      tags: [metrix]
      summary: List staged manual imports for an ad account
      description: Returns every staged manual import (both performance CSV kinds and creative assets) for the account, newest first. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Staged imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListManualImportsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/{importId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        description: Manual import identifier.
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateManualImportAdNames
      tags: [metrix]
      summary: Edit the ad-name mapping for a staged creative asset
      description: Updates the ad_names mapping for a staged creative_asset import (the ad(s) this creative file represents). Only valid for creative_asset imports.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManualImportAdNamesInput"
      responses:
        "200":
          description: Updated import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImport"
        "400":
          description: Invalid input, or import is not a creative_asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteManualImport
      tags: [metrix]
      summary: Remove a staged manual import
      description: Deletes a staged manual import (performance CSV or creative asset) before it has been consumed by an analysis run. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/manual-imports/{importId}/file:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: importId
        in: path
        required: true
        description: Manual import identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getManualImportFile
      tags: [metrix]
      summary: Fetch the raw bytes of a staged manual import (creative asset)
      description: Streams the raw file content staged for this import, with its original content type. Used as the `src` of an `<img>`/`<video>` tag directly — not a JSON response. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Raw file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account or import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/manual-performance-csv-format:
    get:
      operationId: getManualPerformanceCsvFormat
      tags: [metrix]
      summary: Required template format for the two manual performance CSV uploads
      description: Returns the exact breakdown + metric column requirements for both required CSV classes (IAP_DEMOGRAPHIC_TEXT_SIGNAL and IAP_DEVICE_PLACEMENT_PLATFORM_SIGNAL), each with Base metrics (required) plus Ecommerce/Service/App metric groups (optional, never fabricated when absent), and a valid sample CSV per class. Used by the upload UI to show users exactly what to export from Meta Ads Manager.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Column format spec for both CSV classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPerformanceCsvFormat"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/analysis-runs:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: startManualAnalysisRun
      tags: [metrix]
      summary: Manually run analysis over an account's staged performance CSVs
      description: Parses the account's staged performance_csv manual imports into performance data for the selected date window (7d/14d/30d/all — anchored to the latest date found in the uploaded data, not wall-clock time). Never runs automatically on upload — only from this explicit call. Returns 202 with the run id immediately; poll the latest-run endpoint for the outcome, including the exact date range analyzed. Requires access to the account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisInput"
      responses:
        "202":
          description: Analysis run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGenerationResult"
        "400":
          description: Invalid date_range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An analysis run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Prerequisites missing (no staged performance CSV, or none in range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/sync-creative-links:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: syncCreativeLinks
      tags: [metrix]
      summary: Re-sync creative asset links for an account
      description: Re-attempts linking all staged creative assets to their mapped ad names for the account. Useful after correcting an ad_names mapping on an existing upload without re-running the full analysis. Returns counts of linked and unlinked names. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sync complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCreativeLinksResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/analysis-runs/latest:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getLatestAnalysisRun
      tags: [metrix]
      summary: Latest manual analysis run for an account
      description: Returns the most recent manual analysis run for the account, or null when none exists. Runs stuck in 'running' past the staleness cutoff are honestly flipped to 'error'. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest run (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestAnalysisRunResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/generate/strategy:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: generateAccountStrategy
      tags: [metrix]
      summary: Generate strategy (pillars + hypotheses) from the account's analysis data
      description: Starts an in-app Metrix engine run that generates message pillars and testing hypotheses grounded in the account's real analysis rows. Returns 202 with the run id immediately; poll the latest-run endpoint for the outcome. Generated rows carry source='generated' and never touch imported rows. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "202":
          description: Generation run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGenerationResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A generation run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Prerequisites missing (no analysis data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/generate/briefs:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
    post:
      operationId: generateAccountBriefs
      tags: [metrix]
      summary: Generate draft creative briefs from the account's stored strategy pillars
      description: Starts an in-app Metrix engine run that generates draft briefs from the account's stored strategy pillars (generated set preferred, else imported). Returns 202 with the run id immediately; poll the latest-run endpoint for the outcome. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "202":
          description: Generation run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGenerationResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A generation run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Prerequisites missing (no strategy pillars)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/accounts/{accountId}/generation-runs/{kind}/latest:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Ad account identifier.
        schema:
          type: string
          minLength: 1
      - name: kind
        in: path
        required: true
        description: Generation kind.
        schema:
          type: string
          enum: [strategy, briefs]
    get:
      operationId: getLatestGenerationRun
      tags: [metrix]
      summary: Latest generation run for an account and kind
      description: Returns the most recent generation run for the account and kind (strategy or briefs), or null when none exists. Runs stuck in 'running' past the staleness cutoff are honestly flipped to 'error'. Requires access to the account.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest run (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestGenerationRunResult"
        "400":
          description: Invalid kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/agent-waitlist:
    post:
      operationId: joinAgentWaitlist
      tags: [metrix]
      summary: Join the Metrix Agent waitlist
      description: Stores an email address on the Metrix Agent waitlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "200":
          description: Waitlist signup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignupResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listAgentWaitlist
      tags: [metrix]
      summary: List Metrix Agent waitlist signups
      description: Returns a page of waitlist entries (email and joined date), newest first. Use limit/offset to page through results; total reflects the full count. Requires an admin bearer key.
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of entries to skip from the newest entry (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/agent-waitlist/{entryId}/approve:
    parameters:
      - name: entryId
        in: path
        required: true
        description: Waitlist entry identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: approveAgentWaitlistEntry
      tags: [metrix]
      summary: Approve a waitlist entry and provision a user account
      description: Creates (or resets) a user account with a temporary password for the waitlisted email, marks the entry approved, and emails the temporary password to the user. When the email provider is not configured, the temporary password is returned to the admin instead. Requires an admin bearer key.
      security:
        - adminKey: []
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistApprovalResult"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/agent-waitlist/{entryId}/reject:
    parameters:
      - name: entryId
        in: path
        required: true
        description: Waitlist entry identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: rejectAgentWaitlistEntry
      tags: [metrix]
      summary: Reject a waitlist entry
      description: Marks a pending waitlist entry as rejected. Rejected entries never receive an account. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistRejectResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/session:
    post:
      operationId: adminLogin
      tags: [metrix]
      summary: Log in to the admin panel with the admin password
      description: Verifies the admin panel password and sets a short-lived httpOnly admin cookie. Fails closed when the admin password is not configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Wrong password or admin access not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getAdminSession
      tags: [metrix]
      summary: Check whether an admin session is active
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
    delete:
      operationId: adminLogout
      tags: [metrix]
      summary: End the admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /metrix/admin/email-status:
    get:
      operationId: getAdminEmailStatus
      tags: [metrix]
      summary: Report the email delivery configuration
      description: Reports whether outbound email is fully configured, limited to the sandbox sender (delivery only to the Resend account owner), or disabled because no API key is set. Also reports which environment (development or production) this server is running in, since each environment has its own user database. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Email delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailStatus"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users:
    get:
      operationId: listAdminUsers
      tags: [metrix]
      summary: List provisioned user accounts
      description: Returns all provisioned user accounts with their status (active, invited, or disabled), newest first. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Provisioned users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAdminUser
      tags: [metrix]
      summary: Provision a user account directly (without a waitlist entry)
      description: Creates a new user account (or re-provisions an existing one), optionally assigning a role and ad account grants. Generates a temp password, emails it if Resend is configured, and returns it for manual sharing when email fails. Requires admin access.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserInput"
      responses:
        "200":
          description: User created / re-provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateUserResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/resend-temp-password:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminResendTempPassword
      tags: [metrix]
      summary: Issue a new temporary password and email it
      description: Generates a fresh temporary password, forces a password change on next login, revokes all of the user's sessions, and emails the new temporary password. When the email cannot be delivered, the temporary password is returned so the admin can share it manually. Refuses (409) for disabled accounts — restore access first. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResendTempPasswordResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Account is disabled — restore access first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/send-password-reset:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminSendPasswordReset
      tags: [metrix]
      summary: Send the user a password reset link
      description: Creates a single-use, 1-hour password reset link and emails it to the user. Their current password keeps working until the link is used. When the email cannot be delivered, the link is returned so the admin can share it manually. Refuses (409) for disabled accounts. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Reset link result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSendPasswordResetResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Account is disabled — restore access first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/revoke:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminRevokeUser
      tags: [metrix]
      summary: Revoke a user's access
      description: Disables the account and immediately destroys all of its sessions. The user can no longer log in, use existing sessions, or reset their password. Reversible via restore or re-approval. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Revoke result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserActionResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/restore:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: adminRestoreUser
      tags: [metrix]
      summary: Restore a revoked user's access
      description: Re-enables a disabled account. The user's existing password keeps working (sessions were destroyed at revoke time, so they must log in again). Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserActionResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/ad-accounts:
    get:
      operationId: listAdminAdAccounts
      tags: [metrix]
      summary: List all known ad accounts (for the admin grant picker)
      description: Returns all ad accounts from the Metrix data layer so the admin console can populate the ad account picker when adding users or managing grants. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: All known ad accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdAccountsResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Metrix data layer unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: deleteAdminUser
      tags: [metrix]
      summary: Hard-delete a user account
      description: Permanently deletes the user row, all their sessions, ad account grants, and password reset tokens. Irreversible. Must pass `?confirm=true` as a query param. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeleteUserResult"
        "400":
          description: Missing or invalid confirm param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/admin/users/{userId}/ad-accounts:
    parameters:
      - name: userId
        in: path
        required: true
        description: User account identifier.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getAdminUserAdAccounts
      tags: [metrix]
      summary: Get a user's current ad account grants
      description: Returns the list of ad account ids this user has been granted access to. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Current grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAdAccountsResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAdminUserAdAccounts
      tags: [metrix]
      summary: Replace a user's ad account grants
      description: Replaces the user's full grant list with the submitted ad_account_ids array. Pass an empty array to clear all grants. Unknown account ids are silently skipped. Requires admin access.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserAdAccountsInput"
      responses:
        "200":
          description: Updated grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAdAccountsResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/request-access/{requestId}/approve:
    parameters:
      - name: requestId
        in: path
        required: true
        description: Access request identifier (UUID).
        schema:
          type: string
    post:
      operationId: approveRequestAccessEntry
      tags: [metrix]
      summary: Approve an access request and provision a user account
      description: Creates (or resets) a user account with a temporary password for the requester, marks the request approved, and emails the temporary password. When the email provider is not configured, the temporary password is returned to the admin instead. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistApprovalResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/request-access/{requestId}/reject:
    parameters:
      - name: requestId
        in: path
        required: true
        description: Access request identifier (UUID).
        schema:
          type: string
    post:
      operationId: rejectRequestAccessEntry
      tags: [metrix]
      summary: Reject an access request
      description: Marks a pending access request as rejected. Requires admin access.
      security:
        - adminKey: []
      responses:
        "200":
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistRejectResult"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/login:
    post:
      operationId: authLogin
      tags: [metrix]
      summary: Log in with email and password
      description: Verifies credentials and sets an httpOnly session cookie. Returns the authenticated user, including whether a password change is required before using the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/logout:
    post:
      operationId: authLogout
      tags: [metrix]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResult"
  /metrix/auth/me:
    get:
      operationId: authMe
      tags: [metrix]
      summary: Get the current authenticated user
      description: Returns the user attached to the current session cookie, or 401 when not logged in.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/change-password:
    post:
      operationId: authChangePassword
      tags: [metrix]
      summary: Change the current user's password
      description: Verifies the current password and replaces it. Clears the must-change-password flag and revokes all other sessions for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResult"
        "400":
          description: Invalid new password or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/request-password-reset:
    post:
      operationId: authRequestPasswordReset
      tags: [metrix]
      summary: Request a password reset link
      description: Always responds neutrally whether or not an account exists for the email (no account enumeration). When an account exists, a single-use reset link (valid ~1 hour) is emailed via the configured provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequestPasswordResetInput"
      responses:
        "200":
          description: Neutral acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRequestPasswordResetResult"
        "400":
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [metrix]
      summary: Complete a password reset with a token
      description: Consumes a single-use reset token from the emailed link and sets a new password. On success, every existing session for the user is revoked; the user must log in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResetPasswordResult"
        "400":
          description: Invalid, expired, or already-used token, or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceInvites
      tags: [metrix]
      summary: List pending workspace invites
      description: Returns invites created for this workspace, newest first. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitesResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceInvite
      tags: [metrix]
      summary: Invite a member to the workspace
      description: Creates a pending invite for the given email and role. Idempotent per workspace and email. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInviteInput"
      responses:
        "200":
          description: Invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: revokeWorkspaceInvite
      tags: [metrix]
      summary: Revoke a pending workspace invite
      description: Deletes the pending invite, freeing its seat. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWorkspaceInviteResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/invites/{inviteId}/resend:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: inviteId
        in: path
        required: true
        description: Invite identifier.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvite
      tags: [metrix]
      summary: Resend a pending workspace invite
      description: Bumps the invite's created_at timestamp to now and returns the updated invite. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteResendResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members/{email}/permissions:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: email
        in: path
        required: true
        description: Member's email address (URL-encoded).
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateMemberPermissions
      tags: [metrix]
      summary: Update a member's master-level permissions
      description: Sets the member's manage_team and view_agency_rollups flags. Manage-team-only; requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberPermissionsInput"
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMemberPermissionsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace, or lacks manage-team permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members/{email}/resend-temp-password:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: email
        in: path
        required: true
        description: Member's email address (URL-encoded).
        schema:
          type: string
          minLength: 1
    post:
      operationId: resendMemberTempPassword
      tags: [metrix]
      summary: Issue a fresh temp password for a member
      description: Generates a new temp password, invalidates the member's sessions and outstanding reset links, and emails it. Manage-team-only; requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Temp password reissued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberResendTempPasswordResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace, or lacks manage-team permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Member account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members/{email}/status:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: email
        in: path
        required: true
        description: Member's email address (URL-encoded).
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateMemberStatus
      tags: [metrix]
      summary: Disable or restore a member's access
      description: Disabling revokes all sessions and rejects future logins with a generic message; restoring re-enables login. Manage-team-only; requires a logged-in session with access to the workspace. Cannot disable your own account or a designated agency admin account.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberStatusInput"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMemberStatusResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace, lacks manage-team permission, or the target is protected (self or agency admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Disabling would leave the workspace with zero admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
    get:
      operationId: listWorkspaceMembers
      tags: [metrix]
      summary: List real workspace member accounts
      description: Returns provisioned user accounts (real logins) for this workspace, newest first. Requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembersResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrix/workspaces/{workspaceId}/members/{email}/ad-accounts:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace (manager account) identifier.
        schema:
          type: string
          minLength: 1
      - name: email
        in: path
        required: true
        description: Member's email address (URL-encoded).
        schema:
          type: string
          minLength: 1
    get:
      operationId: listMemberAdAccounts
      tags: [metrix]
      summary: List a member's granted ad accounts
      description: Returns the ad account ids this member has been granted access to. Admin-only; requires a logged-in session with access to the workspace.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Member ad-account grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdAccountsResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this workspace, or not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
