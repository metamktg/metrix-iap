      required:
        - email
        - status
        - created_at
        - last_login_at
    WorkspaceMembersResult:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
      required:
        - members
    ChannelPref:
      type: object
