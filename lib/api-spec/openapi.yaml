          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No access to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
