name: CI

# Runs everything from the Replit "Project" validation workflow that does
# NOT require live secrets (DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# DEMO_ACCOUNT_PASSWORD, ...) — none of those are provisioned on this repo
# yet. Deliberately excludes:
#   - api-server-tests: needs DATABASE_URL (password-reset cleanup runs
#     against dev Replit Postgres)
#   - seed-fixture-drift: needs a running API server + live Supabase +
#     DEMO_ACCOUNT_PASSWORD
# Everything below either has no external dependency or (marketing-form-e2e,
# metrix-iap-build) intercepts/mocks the network calls it would otherwise
# need a backend for. See docs/resources/METRIX_Platform_Gap_Audit_Phase1.md
# for the full picture and what re-adding the excluded two needs.
#
# Until now, a PR could merge into main with zero automated verification —
# the Replit workflow only runs when someone manually presses it in the
# Replit workspace. This closes that gap for everything it safely can.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Two real bugs found by actually running this in CI, not assumed:
        # (1) login-page-layout.spec.ts and other e2e specs launch chromium
        #     headless, which since Playwright 1.4x+ resolves to a separate
        #     "Chromium Headless Shell" binary distinct from full Chromium —
        #     "chromium" alone did not pull it in. Installing both explicitly.
        # (2) Only playwright-core (the library) is a dependency here, not
        #     the playwright CLI package — so bare `npx playwright install`
        #     doesn't resolve the repo's pinned version at all. npx fetched
        #     a fresh, different, newer playwright from the registry instead,
        #     which downloaded a browser revision the pinned playwright-core
        #     doesn't match ("Executable doesn't exist at
        #     .../chromium_headless_shell-1228/...": runtime expected 1228,
        #     the unpinned installer fetched 1234). Pinning to the exact
        #     installed playwright-core version (read from node_modules,
        #     not hardcoded) so installer and runtime always agree even
        #     after future version bumps.
        run: |
          PW_VERSION=$(node -p "require('./node_modules/playwright-core/package.json').version")
          npx "playwright@$PW_VERSION" install --with-deps chromium chromium-headless-shell

      - name: Typecheck (all packages)
        run: pnpm run typecheck

      - name: Disclosure rulebook (blocking)
        # Was advisory while ~170 pre-existing violations were being paid down
        # across separate PRs (docs/resources/METRIX_UI_Disclosure_Audit_Phase1.md).
        # That backlog reached ZERO, verified against pristine main as well as
        # this branch, so the condition the comment set for flipping it —
        # "flip continue-on-error to false once the backlog reaches zero" — is met.
        #
        # Flipped BEFORE the Phase 3 UI pass rather than after: the gate is a
        # ratchet (scripts/src/disclosure-rulebook.baseline.json, a file's count
        # may only go down), and a ratchet is worth most immediately before the
        # churn it exists to contain. Flipping it after Phase 3 would be closing
        # the barn door.
        #
        # A PR only fails here if it INTRODUCES a raw pixel text-size class, which
        # is exactly the regression the typography system forbids. If that ever
        # blocks legitimate work, the fix is the typography role (TYPE.* in
        # artifacts/metrix-iap/src/pages/metrix/typography.ts), not a baseline bump.
        run: pnpm --filter @workspace/scripts run check:disclosure-rulebook

      - name: Text contrast checks
        run: |
          pnpm --filter @workspace/scripts run check:text-primary-contrast
          pnpm --filter @workspace/scripts run check:css-token-contrast
          pnpm --filter @workspace/scripts run check:text-muted-contrast

      - name: API codegen drift
        run: pnpm --filter @workspace/scripts run check:api-codegen-drift

      - name: Scripts unit tests
        run: pnpm --filter @workspace/scripts run test

      - name: API server pure unit tests (no DB)
        # The api-server vitest suite as a whole needs live secrets
        # (DATABASE_URL / Supabase) and stays excluded — see the header
        # comment. But "the suite needs secrets" was over-applied: only 22 of
        # its 38 files do. The 16 below import nothing that reads DATABASE_URL
        # or SUPABASE_DB_URL at module load and pass on a bare checkout —
        # verified by running each file individually with no env set. Five of
        # them used to gate PRs; the other eleven (283 tests total) did not,
        # which left the column-mapping cascade, the seed-assembly columns fix
        # that resolved a production outage, objective coverage and the
        # class-detection logic with no automated gate at all.
        #
        # Keep this list append-only as pure suites are added. A file belongs
        # here only if `vitest run <file>` passes with no environment; anything
        # touching lib/db or requiring SUPABASE_DB_URL does not.
        run: >
          pnpm --filter @workspace/api-server exec vitest run
          src/lib/__tests__/adminPanelSession.test.ts
          src/lib/__tests__/analysisCsvClassCheck.test.ts
          src/lib/__tests__/analysisEngine.test.ts
          src/lib/__tests__/analysisEngineAdRowGuards.test.ts
          src/lib/__tests__/analysisEngineCoverage.test.ts
          src/lib/__tests__/analysisEngineSignals.test.ts
          src/lib/__tests__/cellCreativeValidation.test.ts
          src/lib/__tests__/creativeAssetType.test.ts
          src/lib/__tests__/deconstructionReclassify.test.ts
          src/lib/__tests__/generatedCurrency.test.ts
          src/lib/__tests__/iapCsvDayNormalization.test.ts
          src/lib/__tests__/iapCsvMapping.test.ts
          src/lib/__tests__/iapCsvParser.test.ts
          src/lib/__tests__/iapCsvWarningSignal.test.ts
          src/lib/__tests__/metaGraph.test.ts
          src/lib/__tests__/metrixSeedAssembly.test.ts
          src/lib/__tests__/objectiveCoverage.test.ts
          src/lib/__tests__/runHeartbeat.test.ts
          src/lib/__tests__/selectAllPagination.test.ts
          src/lib/__tests__/xlsxToCsv.test.ts

      - name: API server smoke (boots without Supabase env by design)
        # The server now imports the Anthropic AI integration client at module
        # load time (lib/integrations-anthropic-ai), which throws immediately
        # if these are unset — discovered by actually running this step, not
        # assumed. Placeholders are enough: /api/healthz never calls the
        # client, and Replit normally auto-provisions the real values.
        env:
          AI_INTEGRATIONS_ANTHROPIC_BASE_URL: "https://ci-placeholder.invalid"
          AI_INTEGRATIONS_ANTHROPIC_API_KEY: "ci-placeholder-key"
        run: pnpm --filter @workspace/scripts run smoke:api-server

      - name: Metrix IAP vitest suite + login page layout e2e
        run: pnpm --filter @workspace/scripts run smoke:metrix-iap-tests

      - name: Metrix IAP production build
        run: pnpm --filter @workspace/scripts run smoke:metrix-iap-build

      - name: Marketing production build
        run: pnpm --filter @workspace/scripts run smoke:marketing-build

      - name: Marketing form e2e (network mocked, no real backend)
        run: pnpm --filter @workspace/scripts run smoke:marketing-e2e
