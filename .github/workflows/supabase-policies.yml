name: Supabase policies

# Automates the check that used to be manual: every push to a policy file
# gets validated against the live Metrix Supabase project before merge, and
# applied for real the moment it lands on main — closing the gap where a
# fix could sit in `supabase/policies/` for days before someone remembered
# to run `migrate:metrix-official` by hand.
#
# supabase/policies/*.sql is idempotent by convention (drop policy if
# exists / create or replace function / alter table ... enable row level
# security — see supabase/policies/README.md), so re-running it here is
# always safe. supabase/migrations/ is deliberately NOT touched by this
# workflow: those files are checksum-guarded and immutable, applied only
# by the manual `migrate:metrix-official` script.

on:
  pull_request:
    paths:
      - "supabase/policies/**"
  push:
    branches: [main]
    paths:
      - "supabase/policies/**"

jobs:
  # PRs: prove every policy file still applies cleanly, without touching
  # the live database. Runs inside a single transaction that is always
  # rolled back, mirroring the ROLLBACK pattern already used by
  # artifacts/api-server/src/lib/__tests__/metrixOfficialSecurity.test.ts.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Dry-run policies (rolled back, no live mutation)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not configured for this repo — cannot validate against the live schema." >&2
            exit 1
          fi
          {
            echo "begin;"
            for f in supabase/policies/*.sql; do
              echo "-- applying: $f"
              cat "$f"
            done
            echo "rollback;"
          } | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f -

  # main: apply for real. Safe because the files are idempotent — this is
  # the exact same statement sequence the dry-run above just validated.
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Apply policies to live Supabase project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not configured for this repo — cannot apply to the live schema." >&2
            exit 1
          fi
          for f in supabase/policies/*.sql; do
            echo "-- applying: $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
