<!doctype html>
<!-- MST C4A · 1:1 (1080×1080) | East Coast Art Studio | Two-print couple gallery-wall story | EXPLORATORY concept
     BRAND-MATCHED. Two real prints (c4a-l, c4a-r). PLACEHOLDER: short quote/name is representative. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C4A · 1:1 — East Coast Art Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="brand.css">
<style>
 .ad{background:var(--cream)}
 .top{display:flex;align-items:center;justify-content:center;padding:4.4vw 4vw 0}
 .kick{text-align:center;font-size:2.1vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);padding:1.8vw 4vw 0}
 .hl{text-align:center;font-family:var(--serif);font-weight:700;font-size:5.6vw;line-height:1.06;color:var(--ink);padding:1vw 6vw 2.4vw}
 .wall{flex:1 1 36vh;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vw;padding:0 5vw}
 .fr{position:relative;height:100%;display:flex;align-items:center}
 .fr img{height:100%;width:auto;max-width:38vw;object-fit:contain;border-radius:.6vw}
 .amp{font-family:var(--serif);font-style:italic;font-weight:600;font-size:6vw;color:var(--muted);flex:none}
 .attr{text-align:center;font-size:2.4vw;font-style:italic;font-family:var(--serif);color:var(--ink-2);padding:2.8vw 6vw 0;line-height:1.34}
 .attr b{font-style:normal;font-weight:600;color:var(--ink)}
 .cta{padding:2.6vw 5vw 4vw;text-align:center}
</style></head>
<body>
 <div class="ad">
  <div class="top"><div class="eca-logo eca-logo--row" style="font-size:3.4vw"><span class="eca-logo__name">East Coast Art</span><span class="eca-logo__sub">Studio</span></div></div>
  <div class="kick">His street &amp; her street</div>
  <div class="hl">The two streets that<br>became one home.</div>
  <div class="wall">
   <div class="fr"><img class="eca-shadow" src="../images/real/c4a-l.jpg" alt="Framed print of one partner's home street"></div>
   <div class="amp">&amp;</div>
   <div class="fr"><img class="eca-shadow" src="../images/real/c4a-r.jpg" alt="Framed print of the other partner's home street"></div>
  </div>
  <div class="attr">"We framed where we each grew up. Now they hang side by side — just like us." <b>— Dana &amp; Sam</b></div>
  <div class="cta"><a class="eca-cta" style="font-size:2.9vw" href="#">Build your pair <span class="eca-cta__ar">→</span></a></div>
  <div class="eca-tag eca-tag--light">C4A · Exploratory</div>
 </div>
</body></html>
