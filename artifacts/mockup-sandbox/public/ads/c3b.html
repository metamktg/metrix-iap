<!doctype html>
  <!-- MST creative C3B (counter ↙) | design_system CN_Design_GeoIdentity | icp City Loyalist · Nashville
       creative_name: C3B_CN_ICP_CityLoyalist_CN_Design_GeoIdentity_CN_UGC_FW_FAB_TN_Playful_HK_Problem_ST_TOFU_007 -->
  <html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C3B — City Street Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#141010;overflow:hidden}
    .ad{position:relative;width:100vw;height:100vh;font-family:"Work Sans",system-ui,sans-serif;color:#fff;overflow:hidden;--accent:#C15B3C;--soft:#EEB69E;--ctaFg:#ffffff}
    .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .scrim{position:absolute;inset:0;background:
       linear-gradient(to top, rgba(18,14,10,.94) 0%, rgba(18,14,10,.72) 26%, rgba(18,14,10,.18) 52%, rgba(18,14,10,0) 68%),
       linear-gradient(to bottom, rgba(18,14,10,.42) 0%, rgba(18,14,10,0) 22%)}
    .brand{position:absolute;top:5.2vw;left:5.6vw;display:flex;align-items:center;gap:1.4vw;z-index:3}
    .brand svg{width:3vw;height:3vw;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
    .brand .wm{font-family:"Fraunces",serif;font-weight:600;font-size:2.5vw;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .tag{position:absolute;top:5.4vw;right:5.6vw;z-index:3;font-family:"Work Sans",sans-serif;font-weight:600;font-size:1.7vw;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.7vw 1.4vw;backdrop-filter:blur(6px)}
    .content{position:absolute;left:5.6vw;right:5.6vw;bottom:5.6vw;z-index:3}
    .eyebrow{font-weight:600;font-size:1.95vw;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:2.2vw}
    .headline{font-family:"Fraunces",serif;font-weight:600;font-size:5.7vw;line-height:1.05;letter-spacing:-.01em;margin-bottom:2.4vw;text-shadow:0 2px 18px rgba(0,0,0,.4);max-width:15em}
    .sub{font-size:2.55vw;line-height:1.42;color:rgba(255,255,255,.92);max-width:26em;margin-bottom:3.4vw;text-shadow:0 1px 10px rgba(0,0,0,.35)}
    .trust{display:flex;align-items:center;gap:1.4vw;margin-bottom:3.2vw}
    .stars{color:#F2C14E;letter-spacing:.25vw;font-size:2.5vw;text-shadow:0 1px 6px rgba(0,0,0,.4)}
    .trust-text{font-weight:600;font-size:2.1vw;color:rgba(255,255,255,.95)}
    .specs{display:flex;flex-wrap:wrap;gap:1.3vw;margin-bottom:3.4vw}
    .chip{font-weight:500;font-size:1.75vw;letter-spacing:.06em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.34);border-radius:999px;padding:.9vw 1.8vw;background:rgba(255,255,255,.06)}
    .cta{display:inline-flex;align-items:center;gap:1.1vw;background:var(--accent);color:var(--ctaFg);font-family:"Work Sans",sans-serif;font-weight:600;font-size:2.55vw;letter-spacing:.005em;padding:2.4vw 4vw;border-radius:999px;box-shadow:0 1.2vw 3.4vw rgba(0,0,0,.32)}
    .cta .arw{font-size:2.9vw;line-height:1;transform:translateY(.05em)}
  </style></head>
  <body>
    <div class="ad">
      <img class="hero" src="../images/c3b.png" alt="City Loyalist · Nashville — framed street print">
      <div class="scrim"></div>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22s7-6.1 7-12A7 7 0 0 0 5 10c0 5.9 7 12 7 12Z" fill="#fff"/><circle cx="12" cy="10" r="2.5" fill="#C15B3C"/></svg>
        <span class="wm">City Street Print</span>
      </div>
      <div class="tag">C3B</div>
      <div class="content">
        <div class="eyebrow">Real Nashville, not a souvenir rack</div>
        <h1 class="headline">Nashville deserves better than a tourist-shop poster.</h1>
        <p class="sub">Gallery-framed prints of actual neighborhoods — Music Row, 12 South, East Nashville. Made to order.</p>
        
        
        <a class="cta" href="#">Find your Nashville street<span class="arw">→</span></a>
      </div>
    </div>
  </body></html>
