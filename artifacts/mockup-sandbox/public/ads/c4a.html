<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:100%;height:100%;overflow:hidden}
 .ad{--ac:#B0813F;position:relative;width:100vw;height:100vh;overflow:hidden;background:#0e0b09;font-family:"Inter",system-ui,sans-serif}

 .wrap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 6vw 6vw}
 .hook{font-family:"Fraunces",serif;font-weight:600;font-size:6.6vw;line-height:1.06;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.4)}
 .hook em{font-style:italic;font-weight:500;color:#f0d9b0}
 .sub{font-size:2.6vw;line-height:1.35;color:#f0e7d7;margin-top:2.4vw;max-width:32em}
