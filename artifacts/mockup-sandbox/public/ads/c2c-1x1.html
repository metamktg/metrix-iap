<!doctype html>
<!-- MST C2C · 1:1 (1080×1080) | East Coast Art Studio | Editorial single testimonial | ICP: 55+ Self-Decorator
     BRAND-MATCHED. REAL aggregate: "2,500+ happy customers" + 5★. PLACEHOLDER: quote + name (Margaret R.). -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2C · 1:1 — East Coast Art Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="brand.css">
<style>
 .ad{background:var(--cream)}
 .top{display:flex;align-items:center;justify-content:space-between;padding:4vw 4.4vw 2.4vw}
 .stage{position:relative;flex:1 1 42vh;min-height:0;margin:0 4.4vw;border-radius:2.4vw;overflow:hidden}
 .stage img{object-position:center 44%}
 .stage::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(20,16,12,.08);border-radius:2.4vw}
 .quote{padding:3vw 5vw 1.2vw;position:relative}
 .mark{font-family:var(--serif);font-weight:800;font-size:10vw;line-height:.5;color:var(--amber);height:5vw;display:block}
 .q{font-family:var(--serif);font-weight:600;font-size:4.8vw;line-height:1.14;color:var(--ink);margin-top:1.6vw}
 .attr{padding:1.8vw 5vw 0;font-size:2.3vw;font-weight:600;color:var(--ink-2)}
 .attr .st{color:var(--star);margin-right:1vw}
 .foot{display:flex;align-items:center;justify-content:space-between;padding:2.8vw 5vw 4vw}
</style></head>
<body>
 <div class="ad">
  <div class="top">
   <div class="eca-logo eca-logo--row" style="font-size:3.4vw"><span class="eca-logo__name">East Coast Art</span><span class="eca-logo__sub">Studio</span></div>
   <div class="eca-chip" style="font-size:2.1vw"><span class="eca-stars" style="font-size:2.3vw">★★★★★</span>2,500+ happy customers</div>
  </div>
  <div class="stage"><img class="eca-fill" src="../images/real/c2c.jpg" alt="Framed city-street print above a sofa in a warm living room"></div>
  <div class="quote">
   <span class="mark">&ldquo;</span>
   <div class="q">It's the first thing everyone comments on when they walk in.</div>
  </div>
  <div class="attr"><span class="st">★★★★★</span>Margaret R. · Verified buyer</div>
  <div class="foot">
   <a class="eca-cta" style="font-size:2.8vw" href="#">Shop the collection <span class="eca-cta__ar">→</span></a>
   <div class="eca-chip" style="font-size:2vw"><span class="ck">✓</span>Real wood frames</div>
  </div>
  <div class="eca-tag eca-tag--light">C2C</div>
 </div>
</body></html>
