<!doctype html>
<!-- MST C3C (main ↘) | East Coast Art Studio | archetype: Aspirational lifestyle hero | ICP: City Loyalist
     BRAND-MATCHED to eastcoastartstudio.com — mirrors the site's own hero (image-dominant + elegant serif overlay).
     REAL social proof: "2,500+ Happy Customers" + 5★. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C3C — East Coast Art Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="brand.css">
<style>
 .ad{background:var(--dark)}
 .media{position:absolute;inset:0}
 .media::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,14,11,.55),rgba(18,14,11,0) 26%)}
 .media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,14,11,.92) 4%,rgba(18,14,11,.42) 40%,rgba(18,14,11,0) 66%)}
 .top{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.8vw;padding:4.4vw 4vw 0}
 .rating{display:inline-flex;align-items:center;gap:1.4vw;font-size:2.15vw;font-weight:500;letter-spacing:.02em;color:#F0E8DB;text-shadow:0 .2vw 1.4vw rgba(18,14,11,.75)}
 .body{position:relative;z-index:5;margin-top:auto;padding:0 5vw 4.4vw;color:#F4EFE7;text-align:center}
 h1{font-family:var(--serif);font-weight:700;font-size:7.4vw;line-height:1.02;letter-spacing:.004em}
 h1 em{font-style:italic;color:#F4EFE7;font-weight:600}
 .sub{font-size:2.6vw;line-height:1.4;color:#E4DBCE;margin:2.4vw auto 3.4vw;max-width:80%}
 .chips{justify-content:center;color:#EFE7DA;font-size:2.2vw;margin-bottom:3.4vw;text-shadow:0 .2vw 1.4vw rgba(18,14,11,.8)}
 .chips .ck{color:var(--amber)}
</style></head>
<body>
 <div class="ad">
  <div class="media"><img class="eca-fill" src="../images/real/c3c.jpg" alt="Framed Music Row Nashville print styled above a console in a warm room"></div>
  <div class="top">
   <div class="eca-logo eca-logo--light" style="font-size:5vw"><span class="eca-logo__name">East Coast Art</span><span class="eca-logo__sub">Studio</span></div>
   <div class="rating"><span class="eca-stars" style="font-size:2.5vw">★★★★★</span>2,500+ Happy Customers</div>
  </div>
  <div class="body">
   <h1>Your Music Row.<br><em>On your wall.</em></h1>
   <div class="sub">The Nashville streets that shaped you — framed in museum-grade detail.</div>
   <div class="eca-chips chips"><span class="eca-chip"><span class="ck">✓</span>Real wood frames</span><span class="eca-chip"><span class="ck">✓</span>Free U.S. shipping</span></div>
   <a class="eca-cta eca-cta--light" style="font-size:3vw" href="#">Find your street <span class="eca-cta__ar">→</span></a>
  </div>
  <div class="eca-tag">C3C</div>
 </div>
</body></html>
